name: Covered Dispatch Credential Proof

on:
  repository_dispatch:
    types: [covered-dispatch-credential-proof]

permissions: {}

jobs:
  receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Record dispatch receipt only
        env:
          CORRELATION_ID: ${{ github.event.client_payload.correlation_id }}
        run: |
          if ! printf '%s' "$CORRELATION_ID" | grep -Eq '^[A-Za-z0-9._-]{1,80}$'; then
            echo "::error::Missing or invalid proof correlation ID."
            exit 1
          fi
          echo "credential-proof event received"
          echo "correlation-id=$CORRELATION_ID"
          echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
