      - name: Certify one current NFL receiving-yards analysis
        if: steps.contract.outputs.mode == 'manual-current-analysis-certification'
        working-directory: private-covered
        env:
          EXPECTED_SHA: ${{ steps.contract.outputs.release_sha }}
          COVERED_PRIVATE_PIPELINE_SHA_V2: ${{ steps.contract.outputs.release_sha }}
          COVERED2_WNBA_SCHEDULER_ENABLED: ${{ vars.COVERED2_WNBA_SCHEDULER_ENABLED }}
          COVERED2_CERTIFICATION_LEDGER_ENABLED: "false"
          COVERED2_CERTIFICATION_LEDGER_PERSISTENT_ENABLED: ${{ vars.COVERED2_CERTIFICATION_LEDGER_ENABLED }}
          COVERED2_MANUAL_CERTIFICATION_VALIDATION: "true"
          COVERED2_MANUAL_VALIDATION: "true"
          COVERED2_MANUAL_VALIDATION_SPORT: ${{ steps.contract.outputs.sport }}
          COVERED2_MANUAL_VALIDATION_MARKET: ${{ steps.contract.outputs.market }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SPORT: ${{ steps.contract.outputs.sport }}
          MARKET: ${{ steps.contract.outputs.market }}
        run: node --experimental-strip-types --loader ./scripts/ts-path-loader.mjs ./scripts/run-covered2-current-analysis-certification.mjs --sport "$SPORT" --market "$MARKET"

      - name: Remove the private checkout
        if: always()
        run: rm -rf private-covered

