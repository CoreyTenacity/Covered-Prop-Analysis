# COVERED 2 PRODUCTION WAKE - the single recurring production trigger.
#
# DISABLING THIS DISABLES THE ENTIRE LIVE COVERED 2 REFRESH PATH.
#
# The name and the comment above used to say "WNBA current-evidence only ...
# never scores, builds a board, publishes a snapshot, grades props". That is no
# longer true and had become actively misleading: this one workflow now owns
#   - WNBA current-evidence refresh
#   - MLB refresh, schedule ingest, identity, player logs and postgame settlement
#   - odds-snapshot and current-prop retention for BOTH leagues
#   - the WNBA league profile
#   - the Covered Picks board build (gated by COVERED2_PICKS_BOARD_BUILD)
#
# Trigger chain, proven 2026-08-28:
#   Cloudflare Worker `covered-github-dispatcher`, cron "0,30 11-23,0-4 * * *" UTC
#     -> repository_dispatch `covered2-wnba-refresh`  (event type UNCHANGED on purpose)
#     -> this workflow, gated by COVERED2_WNBA_SCHEDULER_ENABLED
#     -> the private Covered repo checked out at COVERED_PRIVATE_PIPELINE_SHA_V2
#
# The event type and file path are deliberately NOT renamed: the dispatcher
# sends this exact event, and renaming either would break the only production
# wake for a cosmetic gain.
#
# NOTE: COVERED_GITHUB_SCHEDULER_ENABLED does NOT gate this workflow. It gates
# the legacy covered-production-pipeline.yml only, and is false.
name: "Covered 2 Production Wake (dispatch event: covered2-wnba-refresh)"

on:
  repository_dispatch:
    types: [covered2-wnba-refresh]

permissions:
  contents: read

concurrency:
  group: covered2-wnba-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      COVERED2_ALLOWED_EMAILS: ${{ secrets.COVERED2_ALLOWED_EMAILS }}
      COVERED_PRIVATE_PIPELINE_SHA_V2: ${{ vars.COVERED_PRIVATE_PIPELINE_SHA_V2 }}
      COVERED2_SCHEDULER_CADENCE: ${{ vars.COVERED2_SCHEDULER_CADENCE }}
      COVERED2_PRODUCTION_DEPLOYMENT_AUTHORIZED: ${{ vars.COVERED2_PRODUCTION_DEPLOYMENT_AUTHORIZED }}
      COVERED2_WNBA_SCHEDULER_ENABLED: ${{ vars.COVERED2_WNBA_SCHEDULER_ENABLED }}
      COVERED2_MLB_SCHEDULE_INGEST: ${{ vars.COVERED2_MLB_SCHEDULE_INGEST }}
      COVERED2_MLB_PLAYER_IDENTITY: ${{ vars.COVERED2_MLB_PLAYER_IDENTITY }}
      COVERED_RETENTION_UNBLOCK_ENABLED: ${{ vars.COVERED_RETENTION_UNBLOCK_ENABLED }}
      COVERED_SNAPSHOT_ALIAS_DEDUP_ENABLED: ${{ vars.COVERED_SNAPSHOT_ALIAS_DEDUP_ENABLED }}
      COVERED_COMPACT_RECEIPT_WRITES_ENABLED: ${{ vars.COVERED_COMPACT_RECEIPT_WRITES_ENABLED }}
      COVERED_COMPACT_GAME_LOG_WRITES_ENABLED: ${{ vars.COVERED_COMPACT_GAME_LOG_WRITES_ENABLED }}
      COVERED2_MLB_MARKET_GAMELOG: ${{ vars.COVERED2_MLB_MARKET_GAMELOG }}
      COVERED2_MLB_PLAYER_LOG_REFRESH: ${{ vars.COVERED2_MLB_PLAYER_LOG_REFRESH }}
      COVERED2_MLB_LINEUP_REFRESH: ${{ vars.COVERED2_MLB_LINEUP_REFRESH }}
      COVERED2_NFL_RECEPTIONS_REFRESH: ${{ vars.COVERED2_NFL_RECEPTIONS_REFRESH }}
      COVERED2_NFL_RECEIVING_YARDS_REFRESH: ${{ vars.COVERED2_NFL_RECEIVING_YARDS_REFRESH }}
      COVERED2_NFL_RUSHING_YARDS_REFRESH: ${{ vars.COVERED2_NFL_RUSHING_YARDS_REFRESH }}
      COVERED2_NFL_PASSING_YARDS_REFRESH: ${{ vars.COVERED2_NFL_PASSING_YARDS_REFRESH }}
      COVERED2_PICKS_BOARD_BUILD: ${{ vars.COVERED2_PICKS_BOARD_BUILD }}
      SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
      BBS_API_KEY: ${{ secrets.BBS_API_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COVERED_EGRESS_DIAGNOSTIC: ${{ vars.COVERED_EGRESS_DIAGNOSTIC }}
      KNOWLEDGE_LOW_EGRESS_MODE: ${{ vars.KNOWLEDGE_LOW_EGRESS_MODE }}
      COVERED2_EVENT_AWARE_RUNTIME_ENABLED: ${{ vars.COVERED2_EVENT_AWARE_RUNTIME_ENABLED }}
      COVERED2_EVENT_AWARE_SHADOW_ENABLED: ${{ vars.COVERED2_EVENT_AWARE_SHADOW_ENABLED }}
      COVERED2_CERTIFICATION_LEDGER_ENABLED: ${{ vars.COVERED2_CERTIFICATION_LEDGER_ENABLED }}
      COVERED2_REFRESH_RUNTIME: "github-actions-c2-wnba"
    steps:
      - name: Resolve and validate the C2 dispatch contract
        id: contract
        env:
          EVENT_TYPE: ${{ github.event.action }}
          SCHEMA: ${{ github.event.client_payload.schema }}
          SOURCE: ${{ github.event.client_payload.source }}
          SLOT: ${{ github.event.client_payload.slot }}
          DELIVERY_KEY: ${{ github.event.client_payload.delivery_key }}
          SCHEDULER_ENABLED: ${{ vars.COVERED2_WNBA_SCHEDULER_ENABLED }}
          ALLOWLIST: ${{ secrets.COVERED2_ALLOWED_EMAILS }}
          PIN: ${{ vars.COVERED_PRIVATE_PIPELINE_SHA_V2 }}
          CADENCE: ${{ vars.COVERED2_SCHEDULER_CADENCE }}
          DEPLOYMENT_AUTHORIZED: ${{ vars.COVERED2_PRODUCTION_DEPLOYMENT_AUTHORIZED }}
        run: |
          if [ "$SCHEDULER_ENABLED" != "true" ]; then
            echo "C2 WNBA scheduler disabled; skipping dispatch."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_TYPE" != "covered2-wnba-refresh" ] || [ "$SCHEMA" != "covered2-wnba-refresh/v1" ] || [ "$SOURCE" != "cloudflare-cron" ]; then
            echo "::error::Rejected C2 repository_dispatch contract."
            exit 1
          fi
          if ! printf '%s' "$SLOT" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T([0-9]{2}):(00|30)Z$' || [ "$DELIVERY_KEY" != "covered2:wnba:$SLOT" ]; then
            echo "::error::Rejected C2 dispatch slot."
            exit 1
          fi
          if ! printf '%s' "$PIN" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Pinned private SHA is missing or malformed."
            exit 1
          fi
          if [ "$ALLOWLIST" != "corey093011@gmail.com" ] || [ "$CADENCE" != "0,30 11-23,0-4 * * *" ] || [ "$DEPLOYMENT_AUTHORIZED" != "true" ]; then
            echo "::error::C2 production activation configuration is incomplete."
            exit 1
          fi
          echo "Accepted bounded C2 WNBA slot; immutable configuration validated without printing secrets."
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check out PRIVATE Covered at the immutable production pin
        if: steps.contract.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: CoreyTenacity/Covered
          ref: ${{ vars.COVERED_PRIVATE_PIPELINE_SHA_V2 }}
          token: ${{ secrets.COVERED_PRIVATE_REPO_TOKEN }}
          path: private-covered
          persist-credentials: false
          fetch-depth: 1

      - name: Verify private checkout exactly matches the immutable pin
        if: steps.contract.outputs.skip != 'true'
        working-directory: private-covered
        env:
          EXPECTED_SHA: ${{ vars.COVERED_PRIVATE_PIPELINE_SHA_V2 }}
        run: |
          GOT="$(git rev-parse HEAD)"
          if [ "$GOT" != "$EXPECTED_SHA" ]; then
            echo "::error::Private checkout does not match the immutable production pin."
            exit 1
          fi
          echo "Private checkout pin verified."

      - name: Set up pnpm
        if: steps.contract.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Set up Node
        if: steps.contract.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the pinned private runtime
        if: steps.contract.outputs.skip != 'true'
        working-directory: private-covered
        run: pnpm install --frozen-lockfile

      - name: Run exactly one bounded C2 WNBA current-evidence refresh
        if: steps.contract.outputs.skip != 'true'
        working-directory: private-covered
        env:
          EXPECTED_SHA: ${{ vars.COVERED_PRIVATE_PIPELINE_SHA_V2 }}
          INVOCATION_ID: gha-c2-wnba-${{ github.run_id }}
        run: |
          node --experimental-strip-types --loader ./scripts/ts-path-loader.mjs ./scripts/run-covered2-wnba-refresh.mjs --write --expectedSha "$EXPECTED_SHA" --invocationId "$INVOCATION_ID"

      - name: Remove the private checkout
        if: always()
        run: rm -rf private-covered

# No scoring, board, publication, grading, snapshot, Automatic Picks, MLB,
# NBA, NFL, artifact upload, cache, or private source export belongs here.
