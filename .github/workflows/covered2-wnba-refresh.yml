# COVERED 2 PRODUCTION WAKE - the single recurring production trigger.
#
# DISABLING THIS DISABLES THE ENTIRE LIVE COVERED 2 REFRESH PATH.
#
# The name and the comment above used to say "WNBA current-evidence only ...
# never scores, builds a board, publishes a snapshot, grades props". That is no
# longer true and had become actively misleading: this one workflow now owns
#   - WNBA current-evidence refresh
#   - MLB refresh, schedule ingest, identity, player logs and postgame settlement
#   - odds-snapshot and current-prop retention for BOTH leagues
#   - the WNBA league profile
#   - the Covered Picks board build (gated by COVERED2_PICKS_BOARD_BUILD)
#
# Trigger chain, proven 2026-08-28:
#   Cloudflare Worker `covered-github-dispatcher`, cron "0,30 11-23,0-4 * * *" UTC
#     -> repository_dispatch `covered2-wnba-refresh`  (event type UNCHANGED on purpose)
#     -> this workflow; repository-level preflight and Production gate must both authorize recurrence
#     -> the private Covered repo checked out at the immutable SHA reviewed here
#
# The event type and file path are deliberately NOT renamed: the dispatcher
# sends this exact event, and renaming either would break the only production
# wake for a cosmetic gain.
#
# NOTE: COVERED_GITHUB_SCHEDULER_ENABLED does NOT gate this workflow. It gates
# the legacy covered-production-pipeline.yml only, and is false.
name: "Covered 2 Production Wake (dispatch event: covered2-wnba-refresh)"

on:
  repository_dispatch:
    types: [covered2-wnba-refresh]
  workflow_dispatch:
    inputs:
      operation:
        description: "One bounded exact-market operation"
        required: true
        type: choice
        options:
          - exact-market-preflight
          - exact-market-discovery
          - exact-market-board-refresh
          - mlb-game-identity-diagnostic
          - mlb-event-hydration
          - mlb-player-history-hydration
          - wnba-event-hydration
          - manual-nfl-event-hydration
          - manual-nfl-provider-event-resolution
          - certification-one-observation
          - certification-one-current-analysis
      release_sha:
        description: "Reviewed full Covered release SHA"
        required: true
        type: string
      validation_sport:
        description: "Exact sport"
        required: true
        type: choice
        options:
          - NFL
          - MLB
          - WNBA
          - NBA
      validation_market:
        description: "Exact market key"
        required: false
        type: string
      force_discovery:
        description: "Use the one-off NFL discovery-cadence bypass"
        required: false
        default: false
        type: boolean
      nfl_event_tuple:
        description: "Strict JSON exact-event tuple for one manual NFL operation"
        required: false
        type: string
      scored_prop_id:
        description: "Exact existing scored_props UUID; required only for certification-one-observation"
        required: false
        type: string
      mlb_event_date:
        description: "Exact MLB official date for one current postseason event"
        required: false
        type: string
      mlb_event_start_time:
        description: "Exact expected MLB event start instant in UTC"
        required: false
        type: string
      mlb_home_team_id:
        description: "Exact expected MLB Stats API home team ID"
        required: false
        type: string
      mlb_away_team_id:
        description: "Exact expected MLB Stats API away team ID"
        required: false
        type: string
      mlb_game_type:
        description: "Exact MLB postseason game type (F, D, L, or W)"
        required: false
        type: string
      mlb_series_description:
        description: "Exact series description from MLB Stats API"
        required: false
        type: string
      mlb_game_pk:
        description: "Exact MLB gamePk for one-event Batter Total Bases discovery or history hydration"
        required: false
        type: string
      wnba_event_id:
        description: "Exact ESPN event ID for one upcoming WNBA postseason event"
        required: false
        type: string
      wnba_event_date:
        description: "Exact official WNBA event date in Eastern Time"
        required: false
        type: string
      wnba_event_start_time:
        description: "Exact expected WNBA event start instant in canonical UTC"
        required: false
        type: string
      wnba_home_team_id:
        description: "Exact expected ESPN WNBA home team ID"
        required: false
        type: string
      wnba_away_team_id:
        description: "Exact expected ESPN WNBA away team ID"
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.event.client_payload.manual_validation == true && 'covered2-wnba-refresh-manual-validation' || 'covered2-wnba-refresh' }}
  cancel-in-progress: false

jobs:
  scheduler_preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      allow_refresh: ${{ steps.scheduler_gate.outputs.allow_refresh }}
    steps:
      - name: Fail closed on the repository-level recurring scheduler gate
        id: scheduler_gate
        env:
          TRIGGER: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Manual operations proceed only to the existing Production-environment
          # owner/SHA/operation contract, and only from the owner's main ref.
          if [ "$TRIGGER" = "workflow_dispatch" ]; then
            if [ "$ACTOR" = "CoreyTenacity" ] && [ "$REF_NAME" = "main" ]; then
              echo "allow_refresh=true" >> "$GITHUB_OUTPUT"
              echo "Owner main-ref dispatch deferred to its existing exact-operation contract."
            else
              echo "allow_refresh=false" >> "$GITHUB_OUTPUT"
              echo "Manual dispatch is not from the authorized owner on main; blocked before Production environment."
            fi
            exit 0
          fi

          if [ "$TRIGGER" != "repository_dispatch" ]; then
            echo "allow_refresh=false" >> "$GITHUB_OUTPUT"
            echo "Unsupported trigger; blocked before Production environment."
            exit 0
          fi

          VARIABLE_URL="${GITHUB_API_URL:-https://api.github.com}/repos/${GITHUB_REPOSITORY}/actions/variables/COVERED2_WNBA_SCHEDULER_ENABLED"
          VARIABLE_RESPONSE="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$VARIABLE_URL")" || {
              echo "allow_refresh=false" >> "$GITHUB_OUTPUT"
              echo "Repository-level scheduler variable could not be read; recurrence blocked before Production environment."
              exit 0
            }
          REPOSITORY_SCHEDULER_VALUE="$(printf '%s' "$VARIABLE_RESPONSE" | node -e '
            let input = "";
            for await (const chunk of process.stdin) input += chunk;
            const variable = JSON.parse(input);
            if (variable.name !== "COVERED2_WNBA_SCHEDULER_ENABLED" || typeof variable.value !== "string") {
              throw new Error("repository_scheduler_variable_invalid");
            }
            process.stdout.write(variable.value);
          ')" || {
              echo "allow_refresh=false" >> "$GITHUB_OUTPUT"
              echo "Repository-level scheduler variable response was invalid; recurrence blocked before Production environment."
              exit 0
            }

          if [ "$REPOSITORY_SCHEDULER_VALUE" = "true" ]; then
            echo "allow_refresh=true" >> "$GITHUB_OUTPUT"
            echo "Repository recurring gate explicitly allows this wake; Production gate remains required."
            exit 0
          fi

          echo "allow_refresh=false" >> "$GITHUB_OUTPUT"
          echo "Repository recurring gate is absent, malformed, or not true; blocked before Production environment."

  refresh:
    needs: scheduler_preflight
    if: needs.scheduler_preflight.outputs.allow_refresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      COVERED2_ALLOWED_EMAILS: ${{ secrets.COVERED2_ALLOWED_EMAILS }}
      COVERED2_SCHEDULER_CADENCE: ${{ vars.COVERED2_SCHEDULER_CADENCE }}
      COVERED2_PRODUCTION_DEPLOYMENT_AUTHORIZED: ${{ vars.COVERED2_PRODUCTION_DEPLOYMENT_AUTHORIZED }}
      COVERED2_WNBA_SCHEDULER_ENABLED: ${{ vars.COVERED2_WNBA_SCHEDULER_ENABLED }}
      COVERED2_MLB_SCHEDULE_INGEST: ${{ vars.COVERED2_MLB_SCHEDULE_INGEST }}
      COVERED2_MLB_PLAYER_IDENTITY: ${{ vars.COVERED2_MLB_PLAYER_IDENTITY }}
      COVERED_RETENTION_UNBLOCK_ENABLED: ${{ vars.COVERED_RETENTION_UNBLOCK_ENABLED }}
      COVERED_SNAPSHOT_ALIAS_DEDUP_ENABLED: ${{ vars.COVERED_SNAPSHOT_ALIAS_DEDUP_ENABLED }}
      COVERED_COMPACT_RECEIPT_WRITES_ENABLED: ${{ vars.COVERED_COMPACT_RECEIPT_WRITES_ENABLED }}
      COVERED_COMPACT_GAME_LOG_WRITES_ENABLED: ${{ vars.COVERED_COMPACT_GAME_LOG_WRITES_ENABLED }}
      COVERED2_MLB_MARKET_GAMELOG: ${{ vars.COVERED2_MLB_MARKET_GAMELOG }}
      COVERED2_MLB_MARKET_OPPONENT: ${{ vars.COVERED2_MLB_MARKET_OPPONENT }}
      COVERED2_MLB_PLAYER_LOG_REFRESH: ${{ vars.COVERED2_MLB_PLAYER_LOG_REFRESH }}
      COVERED2_MLB_LINEUP_REFRESH: ${{ vars.COVERED2_MLB_LINEUP_REFRESH }}
      COVERED2_NFL_RECEPTIONS_REFRESH: ${{ vars.COVERED2_NFL_RECEPTIONS_REFRESH }}
      COVERED2_NFL_RECEIVING_YARDS_REFRESH: ${{ vars.COVERED2_NFL_RECEIVING_YARDS_REFRESH }}
      COVERED2_NFL_RUSHING_YARDS_REFRESH: ${{ vars.COVERED2_NFL_RUSHING_YARDS_REFRESH }}
      COVERED2_NFL_PASSING_YARDS_REFRESH: ${{ vars.COVERED2_NFL_PASSING_YARDS_REFRESH }}
      COVERED2_PICKS_BOARD_BUILD: ${{ vars.COVERED2_PICKS_BOARD_BUILD }}
      SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
      BBS_API_KEY: ${{ secrets.BBS_API_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COVERED_EGRESS_DIAGNOSTIC: ${{ vars.COVERED_EGRESS_DIAGNOSTIC }}
      KNOWLEDGE_LOW_EGRESS_MODE: ${{ vars.KNOWLEDGE_LOW_EGRESS_MODE }}
      COVERED2_EVENT_AWARE_RUNTIME_ENABLED: ${{ vars.COVERED2_EVENT_AWARE_RUNTIME_ENABLED }}
      COVERED2_EVENT_AWARE_SHADOW_ENABLED: ${{ vars.COVERED2_EVENT_AWARE_SHADOW_ENABLED }}
      COVERED2_CERTIFICATION_LEDGER_ENABLED: ${{ vars.COVERED2_CERTIFICATION_LEDGER_ENABLED }}
      COVERED2_NFL_RECEIVING_PILOT_ENABLED: ${{ vars.COVERED2_NFL_RECEIVING_PILOT_ENABLED }}
      COVERED2_NFL_RECEIVING_PILOT_START_AT: ${{ vars.COVERED2_NFL_RECEIVING_PILOT_START_AT }}
      COVERED2_REFRESH_RUNTIME: "github-actions-c2-wnba"
    steps:
      - name: Count bounded natural NFL Receiving Yards pilot attempts
        id: pilot_attempt_guard
        env:
          TRIGGER: ${{ github.event_name }}
          MANUAL_VALIDATION: ${{ github.event.client_payload.manual_validation }}
          SCHEDULER_ENABLED: ${{ vars.COVERED2_WNBA_SCHEDULER_ENABLED }}
          MARKET_SCOPE: ${{ vars.COVERED2_SCHEDULED_MARKET_SCOPE }}
          RECEIVING_YARDS_ENABLED: ${{ vars.COVERED2_NFL_RECEIVING_YARDS_REFRESH }}
          RECEPTIONS_ENABLED: ${{ vars.COVERED2_NFL_RECEPTIONS_REFRESH }}
          RUSHING_YARDS_ENABLED: ${{ vars.COVERED2_NFL_RUSHING_YARDS_REFRESH }}
          PASSING_YARDS_ENABLED: ${{ vars.COVERED2_NFL_PASSING_YARDS_REFRESH }}
          CERTIFICATION_WRITE_ENABLED: ${{ vars.COVERED2_CERTIFICATION_LEDGER_ENABLED }}
          NBA_LIFECYCLE_ENABLED: ${{ vars.COVERED2_NBA_LIFECYCLE_ENABLED }}
          PILOT_ENABLED: ${{ vars.COVERED2_NFL_RECEIVING_PILOT_ENABLED }}
          PILOT_START_AT: ${{ vars.COVERED2_NFL_RECEIVING_PILOT_START_AT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Manual owner operations are governed by the contract step, not counted as natural pilot wakes.
          if [ "$TRIGGER" != "repository_dispatch" ] || [ "$MANUAL_VALIDATION" = "true" ]; then
            echo "pilot_attempt_guard=not_applicable" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$SCHEDULER_ENABLED" != "true" ]; then
            echo "pilot_attempt_guard=scheduler_paused" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$MARKET_SCOPE" != "NFL:receiving_yards" ] \
            || [ "$RECEIVING_YARDS_ENABLED" != "true" ] \
            || [ "$RECEPTIONS_ENABLED" != "false" ] \
            || [ "$RUSHING_YARDS_ENABLED" != "false" ] \
            || [ "$PASSING_YARDS_ENABLED" != "false" ] \
            || [ "$CERTIFICATION_WRITE_ENABLED" != "false" ] \
            || [ "$NBA_LIFECYCLE_ENABLED" = "true" ]; then
            echo "::error::Rejected bounded pilot: exact NFL receiving_yards scope and disabled sibling/write capabilities are required."
            exit 1
          fi

          if [ "$PILOT_ENABLED" = "false" ]; then
            echo "pilot_attempt_guard=normal_exact_market_recurrence" >> "$GITHUB_OUTPUT"
            echo "Bounded NFL Receiving Yards pilot mode is explicitly disabled; exact-market normal recurrence remains gated by the validated scope and market capabilities."
            exit 0
          fi
          if [ "$PILOT_ENABLED" != "true" ]; then
            echo "::error::NFL Receiving Yards pilot mode must be exactly true or false."
            exit 1
          fi

          if ! printf '%s' "$PILOT_START_AT" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,3})?Z$'; then
            echo "::error::Bounded NFL pilot start timestamp is missing or malformed."
            exit 1
          fi
          START_EPOCH_MS="$(node -e 'const value = Date.parse(process.argv[1]); if (!Number.isFinite(value)) process.exit(1); process.stdout.write(String(value));' "$PILOT_START_AT")" || {
            echo "::error::Bounded NFL pilot start timestamp is not a valid UTC instant."
            exit 1
          }
          NOW_EPOCH_MS="$(node -e 'process.stdout.write(String(Date.now()))')"
          if [ "$START_EPOCH_MS" -gt "$NOW_EPOCH_MS" ]; then
            echo "::error::Bounded NFL pilot start timestamp is in the future."
            exit 1
          fi
          if [ "$((NOW_EPOCH_MS - START_EPOCH_MS))" -ge 86400000 ]; then
            echo "::error::Bounded NFL pilot window has expired."
            exit 1
          fi

          API_URL="${GITHUB_API_URL:-https://api.github.com}/repos/${GITHUB_REPOSITORY}/actions/workflows/covered2-wnba-refresh.yml/runs"
          RUN_HISTORY="$(curl --fail --silent --show-error --get \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-urlencode "event=repository_dispatch" \
            --data-urlencode "created=>=$PILOT_START_AT" \
            --data-urlencode "per_page=100" \
            "$API_URL")" || {
              echo "::error::Could not read bounded pilot wake history; failing closed before private checkout."
              exit 1
            }
          ATTEMPT_SUMMARY="$(printf '%s' "$RUN_HISTORY" | node -e '
            let input = "";
            for await (const chunk of process.stdin) input += chunk;
            const [start, currentRunId] = process.argv.slice(1);
            const result = JSON.parse(input);
            if (!Array.isArray(result.workflow_runs) || !Number.isInteger(result.total_count) || result.total_count > 100) {
              throw new Error("pilot_history_unbounded_or_invalid");
            }
            const startTime = Date.parse(start);
            const runs = result.workflow_runs.filter((run) =>
              run.event === "repository_dispatch" && Number.isFinite(Date.parse(run.created_at)) && Date.parse(run.created_at) >= startTime,
            );
            const attempts = runs.reduce((sum, run) => sum + Math.max(1, Number(run.run_attempt) || 1), 0);
            const currentIncluded = runs.some((run) => String(run.id) === currentRunId);
            process.stdout.write(`${attempts} ${currentIncluded ? "1" : "0"}`);
          ' "$PILOT_START_AT" "$GITHUB_RUN_ID")" || {
            echo "::error::Could not safely count bounded pilot wake history; failing closed before private checkout."
            exit 1
          }
          read -r PRIOR_ATTEMPTS CURRENT_INCLUDED <<< "$ATTEMPT_SUMMARY"
          if [ "$CURRENT_INCLUDED" = "1" ]; then
            TOTAL_ATTEMPTS="$PRIOR_ATTEMPTS"
          else
            TOTAL_ATTEMPTS="$((PRIOR_ATTEMPTS + 1))"
          fi
          if [ "$TOTAL_ATTEMPTS" -gt 3 ]; then
            echo "::error::Bounded NFL pilot exhausted its three natural wake attempts; refusing private checkout."
            exit 1
          fi
          echo "pilot_attempt_guard=allowed" >> "$GITHUB_OUTPUT"
          echo "pilot_attempt_number=$TOTAL_ATTEMPTS" >> "$GITHUB_OUTPUT"
          echo "Bounded NFL pilot wake attempt $TOTAL_ATTEMPTS of 3 accepted; no pin value or token logged."

      - name: Resolve and validate the C2 dispatch contract
        id: contract
        env:
          EVENT_TYPE: ${{ github.event.action }}
          TRIGGER: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SCHEMA: ${{ github.event.client_payload.schema }}
          SOURCE: ${{ github.event.client_payload.source }}
          SLOT: ${{ github.event.client_payload.slot }}
          DELIVERY_KEY: ${{ github.event.client_payload.delivery_key }}
          MANUAL_VALIDATION: ${{ github.event.client_payload.manual_validation }}
          VALIDATION_SPORT: ${{ github.event.client_payload.manual_validation_sport }}
          FORCE_DISCOVERY: ${{ github.event.client_payload.manual_validation_force_discovery }}
          MANUAL_VALIDATION_ID: ${{ github.event.client_payload.validation_id }}
          VALIDATION_MODE: ${{ github.event.client_payload.manual_validation_mode }}
          CERTIFICATION_OBSERVATION_ID: ${{ github.event.client_payload.certification_observation_id }}
          EXPECTED_SHA: ${{ github.event.client_payload.expected_sha }}
          ACTOR: ${{ github.actor }}
          SENDER: ${{ github.event.sender.login }}
          SCHEDULER_ENABLED: ${{ vars.COVERED2_WNBA_SCHEDULER_ENABLED }}
          ALLOWLIST: ${{ secrets.COVERED2_ALLOWED_EMAILS }}
          CADENCE: ${{ vars.COVERED2_SCHEDULER_CADENCE }}
          DEPLOYMENT_AUTHORIZED: ${{ vars.COVERED2_PRODUCTION_DEPLOYMENT_AUTHORIZED }}
          CERTIFICATION_LEDGER_ENABLED: ${{ vars.COVERED2_CERTIFICATION_LEDGER_ENABLED }}
          BOARD_BUILD_ENABLED: ${{ vars.COVERED2_PICKS_BOARD_BUILD }}
          MANUAL_OPERATION: ${{ inputs.operation }}
          RELEASE_SHA_INPUT: ${{ inputs.release_sha }}
          VALIDATION_SPORT_INPUT: ${{ inputs.validation_sport }}
          VALIDATION_MARKET_INPUT: ${{ inputs.validation_market }}
          FORCE_DISCOVERY_INPUT: ${{ inputs.force_discovery }}
          NFL_EVENT_TUPLE_INPUT: ${{ inputs.nfl_event_tuple }}
          SCORED_PROP_ID_INPUT: ${{ inputs.scored_prop_id }}
          MLB_EVENT_DATE_INPUT: ${{ inputs.mlb_event_date }}
          MLB_EVENT_START_TIME_INPUT: ${{ inputs.mlb_event_start_time }}
          MLB_HOME_TEAM_ID_INPUT: ${{ inputs.mlb_home_team_id }}
          MLB_AWAY_TEAM_ID_INPUT: ${{ inputs.mlb_away_team_id }}
          MLB_GAME_TYPE_INPUT: ${{ inputs.mlb_game_type }}
          MLB_SERIES_DESCRIPTION_INPUT: ${{ inputs.mlb_series_description }}
          MLB_GAME_PK_INPUT: ${{ inputs.mlb_game_pk }}
          WNBA_EVENT_ID_INPUT: ${{ inputs.wnba_event_id }}
          WNBA_EVENT_DATE_INPUT: ${{ inputs.wnba_event_date }}
          WNBA_EVENT_START_TIME_INPUT: ${{ inputs.wnba_event_start_time }}
          WNBA_HOME_TEAM_ID_INPUT: ${{ inputs.wnba_home_team_id }}
          WNBA_AWAY_TEAM_ID_INPUT: ${{ inputs.wnba_away_team_id }}
        run: |
          REVIEWED_RELEASE_SHA="4a6ae017fc442237c048c5498e7a442059f8b3aa"
          NBA_MANUAL_RELEASE_SHA="85acd2eaa3cae4ac7ea5489e17e3800c4c731b29"
          EXPECTED_MANUAL_RELEASE_SHA="$REVIEWED_RELEASE_SHA"
          if [ "$MANUAL_OPERATION" = "exact-market-discovery" ] && [ "$VALIDATION_SPORT_INPUT" = "NBA" ]; then
            EXPECTED_MANUAL_RELEASE_SHA="$NBA_MANUAL_RELEASE_SHA"
          fi
          NFL_TARGET_SUPPLIED="false"
          if [ -n "$NFL_EVENT_TUPLE_INPUT" ]; then
            NFL_TARGET_SUPPLIED="true"
          fi
          validate_nfl_event_tuple() {
            local tuple_shape="$1"
            NFL_TUPLE_SHAPE="$tuple_shape" node --input-type=commonjs <<'NODE'
          const fs = require("node:fs");

          const fail = (message) => {
            console.error(`::error::${message}`);
            process.exit(1);
          };
          const raw = process.env.NFL_EVENT_TUPLE_INPUT ?? "";
          const shape = process.env.NFL_TUPLE_SHAPE;
          const keysByShape = {
            hydration: [
              "nflverseGameId", "officialDate", "expectedStartTime",
              "homeTeamAbbreviation", "awayTeamAbbreviation",
              "canonicalHomeTeamId", "canonicalAwayTeamId",
            ],
            resolver: [
              "canonicalEventId", "nflverseGameId", "officialDate", "expectedStartTime",
              "homeTeamAbbreviation", "awayTeamAbbreviation",
              "canonicalHomeTeamId", "canonicalAwayTeamId",
            ],
            discovery: [
              "canonicalEventId", "nflverseGameId", "providerEventId",
              "officialDate", "expectedStartTime", "homeTeamAbbreviation",
              "awayTeamAbbreviation", "canonicalHomeTeamId", "canonicalAwayTeamId",
            ],
          };
          const allKeys = new Set([
            "canonicalEventId", "nflverseGameId", "providerEventId", "officialDate",
            "expectedStartTime", "homeTeamAbbreviation", "awayTeamAbbreviation",
            "canonicalHomeTeamId", "canonicalAwayTeamId",
          ]);
          if (!keysByShape[shape]) fail("NFL tuple operation shape is invalid.");
          if (raw.trim() === "") fail("NFL exact-event tuple is required for this manual operation.");

          let tuple;
          const rejectDuplicateKeys = (source) => {
            let index = 0;
            const whitespace = () => { while (/\s/.test(source[index] ?? "")) index += 1; };
            const readString = () => {
              const start = index;
              index += 1;
              while (index < source.length) {
                if (source[index] === "\\") { index += 2; continue; }
                if (source[index] === '"') { index += 1; return JSON.parse(source.slice(start, index)); }
                index += 1;
              }
              throw new Error("invalid_json_string");
            };
            const readValue = () => {
              whitespace();
              if (source[index] === "{") {
                index += 1; whitespace();
                const keys = new Set();
                if (source[index] === "}") { index += 1; return; }
                while (index < source.length) {
                  whitespace();
                  if (source[index] !== '"') throw new Error("invalid_json_object_key");
                  const key = readString();
                  if (keys.has(key)) throw new Error("duplicate_json_key");
                  keys.add(key); whitespace();
                  if (source[index++] !== ":") throw new Error("invalid_json_object_separator");
                  readValue(); whitespace();
                  const delimiter = source[index++];
                  if (delimiter === "}") return;
                  if (delimiter !== ",") throw new Error("invalid_json_object_delimiter");
                }
                throw new Error("invalid_json_object");
              }
              if (source[index] === "[") {
                index += 1; whitespace();
                if (source[index] === "]") { index += 1; return; }
                while (index < source.length) {
                  readValue(); whitespace();
                  const delimiter = source[index++];
                  if (delimiter === "]") return;
                  if (delimiter !== ",") throw new Error("invalid_json_array_delimiter");
                }
                throw new Error("invalid_json_array");
              }
              if (source[index] === '"') { readString(); return; }
              const start = index;
              while (index < source.length && !/[\s,}\]]/.test(source[index])) index += 1;
              if (start === index) throw new Error("invalid_json_value");
            };
            readValue(); whitespace();
            if (index !== source.length) throw new Error("invalid_json_trailing_data");
          };
          try {
            rejectDuplicateKeys(raw);
            tuple = JSON.parse(raw);
          } catch (error) {
            if (error?.message === "duplicate_json_key") fail("NFL exact-event tuple contains duplicate identity keys.");
            fail("NFL exact-event tuple must be valid JSON.");
          }
