                echo "wnba_event_start_time=$WNBA_EVENT_START_TIME_INPUT" >> "$GITHUB_OUTPUT"
                echo "wnba_home_team_id=$WNBA_HOME_TEAM_ID_INPUT" >> "$GITHUB_OUTPUT"
                echo "wnba_away_team_id=$WNBA_AWAY_TEAM_ID_INPUT" >> "$GITHUB_OUTPUT"
                ;;
              certification-one-observation)
                if [ "$FORCE_DISCOVERY_INPUT" != "false" ] \
                  || ! printf '%s' "$SCORED_PROP_ID_INPUT" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'; then
                  echo "::error::Certification requires one exact existing scored_prop UUID and no discovery bypass."
                  exit 1
                fi
                echo "mode=manual-certification" >> "$GITHUB_OUTPUT"
                echo "force_discovery=false" >> "$GITHUB_OUTPUT"
                ;;
              certification-one-current-analysis)
                if [ "$FORCE_DISCOVERY_INPUT" != "false" ] \
                  || [ -n "$SCORED_PROP_ID_INPUT" ] \
                  || [ "$VALIDATION_SPORT_INPUT:$VALIDATION_MARKET_INPUT" != "NFL:receiving_yards" ]; then
                  echo "::error::Current-analysis certification is restricted to one fresh NFL receiving-yards candidate without discovery or an external scored-prop ID."
                  exit 1
                fi
                echo "mode=manual-current-analysis-certification" >> "$GITHUB_OUTPUT"
                echo "force_discovery=false" >> "$GITHUB_OUTPUT"
                ;;
              *) echo "::error::Unsupported exact-market operation."; exit 1 ;;
            esac
            echo "release_sha=$RELEASE_SHA_INPUT" >> "$GITHUB_OUTPUT"
            echo "sport=$VALIDATION_SPORT_INPUT" >> "$GITHUB_OUTPUT"
            echo "market=$VALIDATION_MARKET_INPUT" >> "$GITHUB_OUTPUT"
            if [ "$MANUAL_OPERATION" = "certification-one-observation" ]; then
              echo "scored_prop_id=$SCORED_PROP_ID_INPUT" >> "$GITHUB_OUTPUT"
            fi
            if [ "$MANUAL_OPERATION" != "exact-market-board-refresh" ]; then
              echo "publish_board=false" >> "$GITHUB_OUTPUT"
            fi
            case "$MANUAL_OPERATION" in
              exact-market-discovery|exact-market-board-refresh) echo "manual_validation=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "manual_validation=false" >> "$GITHUB_OUTPUT" ;;
            esac
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "exact_manual=true" >> "$GITHUB_OUTPUT"
            echo "EXACT MARKET dispatch accepted: one owner-gated operation, one reviewed release SHA, one sport, and one market."
            exit 0
          fi
          if [ "$MANUAL_VALIDATION" != "" ] && [ "$MANUAL_VALIDATION" != "true" ] && [ "$MANUAL_VALIDATION" != "false" ]; then
            echo "::error::manual_validation must be exactly true or false when provided."
            exit 1
          fi
          if [ "$SCHEDULER_ENABLED" != "true" ]; then
            if [ "$MANUAL_VALIDATION" = "true" ]; then
              echo "::error::The legacy repository_dispatch manual-validation contract is retired. Use the owner-gated workflow_dispatch exact operation on main."
              exit 1
            fi
            echo "C2 global scheduler gate is false; scheduled and ordinary repository_dispatch wakes exit before private checkout."
            echo "mode=paused" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$MANUAL_VALIDATION" = "true" ]; then
            echo "::error::Manual validation is accepted only while the global scheduler gate is false."
            exit 1
          fi
          if [ "$EVENT_TYPE" != "covered2-wnba-refresh" ] || [ "$SCHEMA" != "covered2-wnba-refresh/v1" ] || [ "$SOURCE" != "cloudflare-cron" ]; then
            echo "::error::Rejected C2 repository_dispatch contract."
            exit 1
          fi
          if ! printf '%s' "$SLOT" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T([0-9]{2}):(00|30)Z$' || [ "$DELIVERY_KEY" != "covered2:wnba:$SLOT" ]; then
            echo "::error::Rejected C2 dispatch slot."
            exit 1
          fi
          if [ "$ALLOWLIST" != "corey093011@gmail.com" ] || [ "$CADENCE" != "0,30 11-23,0-4 * * *" ] || [ "$DEPLOYMENT_AUTHORIZED" != "true" ]; then
            echo "::error::C2 production activation configuration is incomplete."
            exit 1
          fi
          echo "Accepted bounded C2 WNBA slot; immutable configuration validated without printing secrets."
          echo "mode=scheduled" >> "$GITHUB_OUTPUT"
          # repository_dispatch has no manual-validation input; pass the
          # private runner's required explicit false instead of an empty value.
          echo "manual_validation=false" >> "$GITHUB_OUTPUT"
          echo "force_discovery=false" >> "$GITHUB_OUTPUT"
          echo "publish_board=false" >> "$GITHUB_OUTPUT"
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "release_sha=$REVIEWED_RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "sport=" >> "$GITHUB_OUTPUT"
          echo "market=" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check out PRIVATE Covered at the public-reviewed immutable release SHA
        if: steps.contract.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: CoreyTenacity/Covered
          ref: ${{ steps.contract.outputs.release_sha }}
          token: ${{ secrets.COVERED_PRIVATE_REPO_TOKEN }}
          path: private-covered
          persist-credentials: false
          fetch-depth: 1

      - name: Verify private checkout exactly matches the public-reviewed release SHA
        if: steps.contract.outputs.skip != 'true'
        working-directory: private-covered
        env:
          EXPECTED_SHA: ${{ steps.contract.outputs.release_sha }}
        run: |
          GOT="$(git rev-parse HEAD)"
          if [ "$GOT" != "$EXPECTED_SHA" ]; then
            echo "::error::Private checkout does not match the public-reviewed immutable release SHA."
            exit 1
          fi
          echo "Private checkout pin verified."

      - name: Set up pnpm
        if: steps.contract.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Set up Node
        if: steps.contract.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the pinned private runtime
        if: steps.contract.outputs.skip != 'true'
        working-directory: private-covered
        run: pnpm install --frozen-lockfile

      - name: Run read-only schema and exact-market availability preflight
        if: steps.contract.outputs.mode == 'manual-preflight'
        working-directory: private-covered
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
          BBS_API_KEY: ${{ secrets.BBS_API_KEY }}
          PREFLIGHT_MARKET: ${{ steps.contract.outputs.market }}
        run: |
          node --experimental-strip-types --loader ./scripts/ts-path-loader.mjs ./scripts/covered2-schema-contract-check.ts
          node --experimental-strip-types --loader ./scripts/ts-path-loader.mjs --input-type=module -e '
            const { refreshNflMarkets } = await import("./lib/knowledge/covered2/nfl-refresh/production.ts");
            const market = process.env.PREFLIGHT_MARKET;
            if (!["passing_yards", "receiving_yards", "rushing_yards"].includes(market)) throw new Error("unsupported_preflight_market");
            const result = await refreshNflMarkets({ write: false, markets: [market], includeReadOnlyDiagnostics: true });
            const manifest = result.byMarket[market]?.manifest;
            const evidence = {
              status: result.status,
              market,
              providerRequests: manifest?.providerRequests ?? 0,
              providerRows: manifest?.providerRows ?? 0,
              marketRows: manifest?.marketRows ?? 0,
              lineRows: manifest?.lineRows ?? 0,
              unresolvedRows: manifest?.unresolvedRows ?? 0,
              rejectionReasons: manifest?.rejectionReasons ?? {},
              providerMarketTypeCounts: manifest?.providerMarketTypeCounts ?? {},
              eventCount: manifest?.events?.length ?? 0,
              currentPropKeyCount: manifest?.currentPropKeys?.length ?? 0,
            };
            console.log(`[exact-market-preflight] ${JSON.stringify(evidence)}`);
            if (evidence.lineRows < 1 || evidence.eventCount < 1 || evidence.currentPropKeyCount < 1) throw new Error("no_live_exact_market_opportunity");
          '

      - name: Admit exactly one NFL event using the dedicated event-only runner
        if: steps.contract.outputs.mode == 'manual-nfl-event-hydration'
        working-directory: private-covered
        env:
          EXPECTED_SHA: ${{ steps.contract.outputs.release_sha }}
          COVERED_PRIVATE_PIPELINE_SHA_V2: ${{ steps.contract.outputs.release_sha }}
          COVERED2_MANUAL_VALIDATION: "true"
          COVERED2_MANUAL_VALIDATION_SPORT: NFL
          COVERED2_MANUAL_VALIDATION_OPERATION: manual-nfl-event-hydration
          COVERED2_MANUAL_NFLVERSE_GAME_ID: ${{ steps.contract.outputs.nfl_nflverse_game_id }}
          COVERED2_MANUAL_NFL_EVENT_DATE: ${{ steps.contract.outputs.nfl_event_date }}
          COVERED2_MANUAL_NFL_EVENT_START_TIME: ${{ steps.contract.outputs.nfl_event_start_time }}
          COVERED2_MANUAL_NFL_HOME_TEAM: ${{ steps.contract.outputs.nfl_home_team }}
          COVERED2_MANUAL_NFL_AWAY_TEAM: ${{ steps.contract.outputs.nfl_away_team }}
          COVERED2_MANUAL_NFL_HOME_TEAM_ID: ${{ steps.contract.outputs.nfl_home_team_id }}
          COVERED2_MANUAL_NFL_AWAY_TEAM_ID: ${{ steps.contract.outputs.nfl_away_team_id }}
          COVERED2_MANUAL_VALIDATION_FORCE_DISCOVERY: ${{ steps.contract.outputs.force_discovery }}
          COVERED2_MANUAL_VALIDATION_PUBLISH_BOARD: ${{ steps.contract.outputs.publish_board }}
          COVERED2_WNBA_SCHEDULER_ENABLED: ${{ vars.COVERED2_WNBA_SCHEDULER_ENABLED }}
          COVERED2_CERTIFICATION_LEDGER_ENABLED: ${{ vars.COVERED2_CERTIFICATION_LEDGER_ENABLED }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SHARPAPI_KEY: ""
          BBS_API_KEY: ""
        run: pnpm run covered2:nfl-event-hydration

      - name: Resolve exactly one admitted NFL provider event ID
        if: steps.contract.outputs.mode == 'manual-nfl-provider-event-resolution'
        working-directory: private-covered
        env:
          EXPECTED_SHA: ${{ steps.contract.outputs.release_sha }}
          COVERED_PRIVATE_PIPELINE_SHA_V2: ${{ steps.contract.outputs.release_sha }}
          COVERED2_MANUAL_VALIDATION: "true"
          COVERED2_MANUAL_VALIDATION_SPORT: NFL
          COVERED2_MANUAL_VALIDATION_OPERATION: manual-nfl-provider-event-resolution
          COVERED2_MANUAL_VALIDATION_FORCE_DISCOVERY: "false"
          COVERED2_MANUAL_NFL_CANONICAL_EVENT_ID: ${{ steps.contract.outputs.nfl_canonical_event_id }}
          COVERED2_MANUAL_NFLVERSE_GAME_ID: ${{ steps.contract.outputs.nfl_nflverse_game_id }}
          COVERED2_MANUAL_NFL_EVENT_DATE: ${{ steps.contract.outputs.nfl_event_date }}
          COVERED2_MANUAL_NFL_EVENT_START_TIME: ${{ steps.contract.outputs.nfl_event_start_time }}
          COVERED2_MANUAL_NFL_HOME_TEAM: ${{ steps.contract.outputs.nfl_home_team }}
          COVERED2_MANUAL_NFL_AWAY_TEAM: ${{ steps.contract.outputs.nfl_away_team }}
          COVERED2_MANUAL_NFL_HOME_TEAM_ID: ${{ steps.contract.outputs.nfl_home_team_id }}
          COVERED2_MANUAL_NFL_AWAY_TEAM_ID: ${{ steps.contract.outputs.nfl_away_team_id }}
          COVERED2_WNBA_SCHEDULER_ENABLED: ${{ vars.COVERED2_WNBA_SCHEDULER_ENABLED }}
          COVERED2_CERTIFICATION_LEDGER_ENABLED: ${{ vars.COVERED2_CERTIFICATION_LEDGER_ENABLED }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
          BBS_API_KEY: ""
        run: pnpm run covered2:nfl-provider-event-resolution

      - name: Run exactly one bounded C2 exact-market discovery
        if: steps.contract.outputs.skip != 'true' && steps.contract.outputs.mode != 'manual-certification' && steps.contract.outputs.mode != 'manual-current-analysis-certification' && steps.contract.outputs.mode != 'manual-preflight' && steps.contract.outputs.mode != 'manual-mlb-game-identity-diagnostic' && steps.contract.outputs.mode != 'manual-mlb-event-hydration' && steps.contract.outputs.mode != 'manual-mlb-player-history-hydration' && steps.contract.outputs.mode != 'manual-wnba-event-hydration' && steps.contract.outputs.mode != 'manual-nfl-event-hydration' && steps.contract.outputs.mode != 'manual-nfl-provider-event-resolution'
        working-directory: private-covered
        env:
          EXPECTED_SHA: ${{ steps.contract.outputs.release_sha }}
          COVERED_PRIVATE_PIPELINE_SHA_V2: ${{ steps.contract.outputs.release_sha }}
          INVOCATION_ID: gha-c2-${{ steps.contract.outputs.mode }}-${{ github.run_id }}
          COVERED2_REFRESH_RUNTIME: ${{ steps.contract.outputs.manual_validation == 'true' && 'github-actions-c2-manual-validation' || 'github-actions-c2-wnba' }}
          COVERED2_MANUAL_VALIDATION: ${{ steps.contract.outputs.manual_validation }}
          COVERED2_MANUAL_VALIDATION_SPORT: ${{ steps.contract.outputs.sport }}
          COVERED2_MANUAL_VALIDATION_MARKET: ${{ steps.contract.outputs.market }}
          COVERED2_MANUAL_MLB_GAME_PK: ${{ steps.contract.outputs.mlb_game_pk }}
          COVERED2_MANUAL_NFL_CANONICAL_EVENT_ID: ${{ ((steps.contract.outputs.mode == 'manual-validation' && steps.contract.outputs.sport == 'NFL' && (steps.contract.outputs.market == 'receiving_yards' || steps.contract.outputs.market == 'rushing_yards')) || (steps.contract.outputs.mode == 'manual-board-refresh' && steps.contract.outputs.sport == 'NFL' && steps.contract.outputs.market == 'receiving_yards')) && steps.contract.outputs.nfl_canonical_event_id || '' }}
          COVERED2_MANUAL_NFL_NFLVERSE_GAME_ID: ${{ ((steps.contract.outputs.mode == 'manual-validation' && steps.contract.outputs.sport == 'NFL' && (steps.contract.outputs.market == 'receiving_yards' || steps.contract.outputs.market == 'rushing_yards')) || (steps.contract.outputs.mode == 'manual-board-refresh' && steps.contract.outputs.sport == 'NFL' && steps.contract.outputs.market == 'receiving_yards')) && steps.contract.outputs.nfl_nflverse_game_id || '' }}
          COVERED2_MANUAL_NFL_PROVIDER_EVENT_ID: ${{ ((steps.contract.outputs.mode == 'manual-validation' && steps.contract.outputs.sport == 'NFL' && (steps.contract.outputs.market == 'receiving_yards' || steps.contract.outputs.market == 'rushing_yards')) || (steps.contract.outputs.mode == 'manual-board-refresh' && steps.contract.outputs.sport == 'NFL' && steps.contract.outputs.market == 'receiving_yards')) && steps.contract.outputs.nfl_provider_event_id || '' }}
          COVERED2_MANUAL_NFL_EVENT_DATE: ${{ ((steps.contract.outputs.mode == 'manual-validation' && steps.contract.outputs.sport == 'NFL' && (steps.contract.outputs.market == 'receiving_yards' || steps.contract.outputs.market == 'rushing_yards')) || (steps.contract.outputs.mode == 'manual-board-refresh' && steps.contract.outputs.sport == 'NFL' && steps.contract.outputs.market == 'receiving_yards')) && steps.contract.outputs.nfl_event_date || '' }}
          COVERED2_MANUAL_NFL_EVENT_START_TIME: ${{ ((steps.contract.outputs.mode == 'manual-validation' && steps.contract.outputs.sport == 'NFL' && (steps.contract.outputs.market == 'receiving_yards' || steps.contract.outputs.market == 'rushing_yards')) || (steps.contract.outputs.mode == 'manual-board-refresh' && steps.contract.outputs.sport == 'NFL' && steps.contract.outputs.market == 'receiving_yards')) && steps.contract.outputs.nfl_event_start_time || '' }}
          COVERED2_MANUAL_NFL_HOME_TEAM: ${{ ((steps.contract.outputs.mode == 'manual-validation' && steps.contract.outputs.sport == 'NFL' && (steps.contract.outputs.market == 'receiving_yards' || steps.contract.outputs.market == 'rushing_yards')) || (steps.contract.outputs.mode == 'manual-board-refresh' && steps.contract.outputs.sport == 'NFL' && steps.contract.outputs.market == 'receiving_yards')) && steps.contract.outputs.nfl_home_team || '' }}
          COVERED2_MANUAL_NFL_AWAY_TEAM: ${{ ((steps.contract.outputs.mode == 'manual-validation' && steps.contract.outputs.sport == 'NFL' && (steps.contract.outputs.market == 'receiving_yards' || steps.contract.outputs.market == 'rushing_yards')) || (steps.contract.outputs.mode == 'manual-board-refresh' && steps.contract.outputs.sport == 'NFL' && steps.contract.outputs.market == 'receiving_yards')) && steps.contract.outputs.nfl_away_team || '' }}
          COVERED2_MANUAL_NFL_HOME_TEAM_ID: ${{ ((steps.contract.outputs.mode == 'manual-validation' && steps.contract.outputs.sport == 'NFL' && (steps.contract.outputs.market == 'receiving_yards' || steps.contract.outputs.market == 'rushing_yards')) || (steps.contract.outputs.mode == 'manual-board-refresh' && steps.contract.outputs.sport == 'NFL' && steps.contract.outputs.market == 'receiving_yards')) && steps.contract.outputs.nfl_home_team_id || '' }}
          COVERED2_MANUAL_NFL_AWAY_TEAM_ID: ${{ ((steps.contract.outputs.mode == 'manual-validation' && steps.contract.outputs.sport == 'NFL' && (steps.contract.outputs.market == 'receiving_yards' || steps.contract.outputs.market == 'rushing_yards')) || (steps.contract.outputs.mode == 'manual-board-refresh' && steps.contract.outputs.sport == 'NFL' && steps.contract.outputs.market == 'receiving_yards')) && steps.contract.outputs.nfl_away_team_id || '' }}
          COVERED2_MANUAL_VALIDATION_FORCE_DISCOVERY: ${{ steps.contract.outputs.force_discovery }}
          COVERED2_MANUAL_VALIDATION_PUBLISH_BOARD: ${{ steps.contract.outputs.publish_board }}
          COVERED2_MANUAL_WNBA_EVENT_ID: ${{ steps.contract.outputs.mode == 'manual-validation' && steps.contract.outputs.sport == 'WNBA' && steps.contract.outputs.market == 'rebounds' && steps.contract.outputs.force_discovery == 'true' && steps.contract.outputs.wnba_event_id || '' }}
          COVERED2_MANUAL_WNBA_EVENT_DATE: ${{ steps.contract.outputs.mode == 'manual-validation' && steps.contract.outputs.sport == 'WNBA' && steps.contract.outputs.market == 'rebounds' && steps.contract.outputs.force_discovery == 'true' && steps.contract.outputs.wnba_event_date || '' }}
          COVERED2_MANUAL_WNBA_EVENT_START_TIME: ${{ steps.contract.outputs.mode == 'manual-validation' && steps.contract.outputs.sport == 'WNBA' && steps.contract.outputs.market == 'rebounds' && steps.contract.outputs.force_discovery == 'true' && steps.contract.outputs.wnba_event_start_time || '' }}
          COVERED2_MANUAL_WNBA_HOME_TEAM_ID: ${{ steps.contract.outputs.mode == 'manual-validation' && steps.contract.outputs.sport == 'WNBA' && steps.contract.outputs.market == 'rebounds' && steps.contract.outputs.force_discovery == 'true' && steps.contract.outputs.wnba_home_team_id || '' }}
          COVERED2_MANUAL_WNBA_AWAY_TEAM_ID: ${{ steps.contract.outputs.mode == 'manual-validation' && steps.contract.outputs.sport == 'WNBA' && steps.contract.outputs.market == 'rebounds' && steps.contract.outputs.force_discovery == 'true' && steps.contract.outputs.wnba_away_team_id || '' }}
          COVERED2_SCHEDULED_MARKET_SCOPE: ${{ vars.COVERED2_SCHEDULED_MARKET_SCOPE }}
          COVERED2_NFL_RECEIVING_PILOT_ENABLED: ${{ vars.COVERED2_NFL_RECEIVING_PILOT_ENABLED }}
          COVERED2_NFL_RECEIVING_PILOT_START_AT: ${{ vars.COVERED2_NFL_RECEIVING_PILOT_START_AT }}
          COVERED2_MLB_SCHEDULE_INGEST: ${{ steps.contract.outputs.mode == 'manual-validation' && steps.contract.outputs.sport != 'MLB' && 'false' || vars.COVERED2_MLB_SCHEDULE_INGEST }}
          COVERED2_MLB_PLAYER_IDENTITY: ${{ steps.contract.outputs.mode == 'manual-validation' && steps.contract.outputs.sport != 'MLB' && 'false' || vars.COVERED2_MLB_PLAYER_IDENTITY }}
          COVERED2_MLB_MARKET_GAMELOG: ${{ steps.contract.outputs.mode == 'manual-validation' && steps.contract.outputs.sport != 'MLB' && 'false' || vars.COVERED2_MLB_MARKET_GAMELOG }}
          COVERED2_MLB_MARKET_OPPONENT: ${{ steps.contract.outputs.mode == 'manual-validation' && steps.contract.outputs.sport != 'MLB' && 'false' || vars.COVERED2_MLB_MARKET_OPPONENT }}
          COVERED2_MLB_PLAYER_LOG_REFRESH: ${{ steps.contract.outputs.mode == 'manual-validation' && steps.contract.outputs.sport != 'MLB' && 'false' || vars.COVERED2_MLB_PLAYER_LOG_REFRESH }}
          COVERED2_MLB_LINEUP_REFRESH: ${{ steps.contract.outputs.mode == 'manual-validation' && steps.contract.outputs.sport != 'MLB' && 'false' || vars.COVERED2_MLB_LINEUP_REFRESH }}
          COVERED2_NFL_RECEPTIONS_REFRESH: ${{ steps.contract.outputs.manual_validation == 'true' && steps.contract.outputs.sport == 'NFL' && steps.contract.outputs.market == 'receptions' && 'true' || steps.contract.outputs.manual_validation == 'true' && 'false' || vars.COVERED2_NFL_RECEPTIONS_REFRESH }}
          COVERED2_NFL_RECEIVING_YARDS_REFRESH: ${{ steps.contract.outputs.manual_validation == 'true' && steps.contract.outputs.sport == 'NFL' && steps.contract.outputs.market == 'receiving_yards' && 'true' || steps.contract.outputs.manual_validation == 'true' && 'false' || vars.COVERED2_NFL_RECEIVING_YARDS_REFRESH }}
          COVERED2_NFL_RUSHING_YARDS_REFRESH: ${{ steps.contract.outputs.manual_validation == 'true' && steps.contract.outputs.sport == 'NFL' && steps.contract.outputs.market == 'rushing_yards' && 'true' || steps.contract.outputs.manual_validation == 'true' && 'false' || vars.COVERED2_NFL_RUSHING_YARDS_REFRESH }}
          COVERED2_NFL_PASSING_YARDS_REFRESH: ${{ steps.contract.outputs.manual_validation == 'true' && steps.contract.outputs.sport == 'NFL' && steps.contract.outputs.market == 'passing_yards' && 'true' || steps.contract.outputs.manual_validation == 'true' && 'false' || vars.COVERED2_NFL_PASSING_YARDS_REFRESH }}
        run: |
          if [ "$COVERED2_MANUAL_VALIDATION" = "true" ]; then
            echo "MANUAL VALIDATION execution run_id=${GITHUB_RUN_ID} runtime=${COVERED2_REFRESH_RUNTIME} expected_sha=${EXPECTED_SHA}"
          fi
          node --experimental-strip-types --loader ./scripts/ts-path-loader.mjs ./scripts/run-covered2-wnba-refresh.mjs --write --expectedSha "$EXPECTED_SHA" --invocationId "$INVOCATION_ID"

      - name: Read exact official MLB game identity without writes
        if: steps.contract.outputs.mode == 'manual-mlb-game-identity-diagnostic'
        working-directory: private-covered
        env:
          EXPECTED_SHA: ${{ steps.contract.outputs.release_sha }}
          COVERED_PRIVATE_PIPELINE_SHA_V2: ${{ steps.contract.outputs.release_sha }}
          COVERED2_MANUAL_MLB_EVENT_HYDRATION: "true"
          COVERED2_WNBA_SCHEDULER_ENABLED: ${{ vars.COVERED2_WNBA_SCHEDULER_ENABLED }}
          COVERED2_CERTIFICATION_LEDGER_ENABLED: ${{ vars.COVERED2_CERTIFICATION_LEDGER_ENABLED }}
          MLB_EVENT_DATE: ${{ steps.contract.outputs.mlb_event_date }}
          COVERED2_ALLOWED_EMAILS: ""
          NEXT_PUBLIC_SUPABASE_URL: ""
          SUPABASE_SECRET_KEY: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
          SHARPAPI_KEY: ""
          BBS_API_KEY: ""
        run: |
          node --experimental-strip-types --loader ./scripts/ts-path-loader.mjs --input-type=module <<'NODE'
          import { main } from "./scripts/run-covered2-mlb-event-hydration.mjs";

          const officialDate = process.env.MLB_EVENT_DATE;
          if (officialDate !== "2026-10-15") throw new Error("mlb_identity_diagnostic_target_date_mismatch");
          const failedSelector = {
            officialDate,
            expectedStartTime: "2026-10-16T00:00:00.000Z",
            homeTeamProviderId: "119",
            awayTeamProviderId: "158",
            gameType: "L",
            seriesDescription: "National League Championship Series",
          };
          const nativeFetch = globalThis.fetch;
          let scheduleRequestCount = 0;
          let sourcePayload;
          globalThis.fetch = async (input, init) => {
            const url = new URL(typeof input === "string" ? input : input instanceof URL ? input : input.url);
            if (url.origin !== "https://statsapi.mlb.com" || url.pathname !== "/api/v1/schedule"
              || url.searchParams.get("sportId") !== "1"
              || url.searchParams.get("startDate") !== officialDate
              || url.searchParams.get("endDate") !== officialDate
              || url.searchParams.get("hydrate") !== "team"
              || (init?.method ?? "GET") !== "GET"
              || scheduleRequestCount !== 0) {
              throw new Error("mlb_identity_diagnostic_unexpected_request");
            }
            scheduleRequestCount += 1;
            const response = await nativeFetch(input, init);
            sourcePayload = JSON.parse(await response.clone().text());
            return response;
          };

          let selectorOutcome = "selected_then_stopped_before_write";
          try {
            await main([
              "--official-date", failedSelector.officialDate,
              "--start-time", failedSelector.expectedStartTime,
              "--home-team-id", failedSelector.homeTeamProviderId,
              "--away-team-id", failedSelector.awayTeamProviderId,
              "--game-type", failedSelector.gameType,
              "--series-description", failedSelector.seriesDescription,
            ], process.env, {
              now: new Date("2026-10-15T12:00:00.000Z"),
              ensureTeam: async () => { throw new Error("diagnostic_stop_before_write"); },
              ensureEvent: async () => { throw new Error("diagnostic_stop_before_write"); },
            });
          } catch (error) {
            selectorOutcome = error instanceof Error ? error.message : "unknown_selector_error";
          } finally {
            globalThis.fetch = nativeFetch;
          }

          if (scheduleRequestCount !== 1 || !sourcePayload || !Array.isArray(sourcePayload.dates)) {
            throw new Error("mlb_identity_diagnostic_source_unavailable");
          }
          const postseasonTypes = new Set(["F", "D", "L", "W"]);
          const allGames = sourcePayload.dates.flatMap((date) => Array.isArray(date.games) ? date.games : []);
          const rows = allGames.filter((game) => game.officialDate === officialDate && postseasonTypes.has(game.gameType)).slice(0, 16);
          const project = (game) => ({
            gamePk: game.gamePk ?? null,
            officialDate: game.officialDate ?? null,
            gameDate: game.gameDate ?? null,
            gameType: game.gameType ?? null,
            seriesDescription: game.seriesDescription ?? null,
            seriesGameNumber: game.seriesGameNumber ?? null,
            awayTeamId: game.teams?.away?.team?.id ?? null,
            awayTeamName: game.teams?.away?.team?.name ?? null,
            homeTeamId: game.teams?.home?.team?.id ?? null,
            homeTeamName: game.teams?.home?.team?.name ?? null,
            status: game.status?.detailedState ?? null,
            scheduledStartTime: game.gameDate ?? null,
          });
          const identity = (value) => String(value ?? "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim().replace(/\s+/g, " ");
          const targetRows = rows.filter((game) => identity(game.teams?.away?.team?.name) === "milwaukee brewers"
            && identity(game.teams?.home?.team?.name) === "los angeles dodgers");
          const official = targetRows.length === 1 ? targetRows[0] : null;
          const comparisons = official ? [
            ["officialDate", failedSelector.officialDate, official.officialDate, failedSelector.officialDate === official.officialDate],
            ["gameType", failedSelector.gameType, official.gameType, failedSelector.gameType === official.gameType],
            ["seriesDescription", failedSelector.seriesDescription, official.seriesDescription, failedSelector.seriesDescription === String(official.seriesDescription ?? "").trim()],
            ["seriesGameNumber", "not used by selector", official.seriesGameNumber ?? null, null],
            ["awayTeamId", failedSelector.awayTeamProviderId, official.teams?.away?.team?.id ?? null, String(failedSelector.awayTeamProviderId) === String(official.teams?.away?.team?.id ?? "")],
            ["awayTeamName", "not used by selector", official.teams?.away?.team?.name ?? null, null],
            ["homeTeamId", failedSelector.homeTeamProviderId, official.teams?.home?.team?.id ?? null, String(failedSelector.homeTeamProviderId) === String(official.teams?.home?.team?.id ?? "")],
            ["homeTeamName", "not used by selector", official.teams?.home?.team?.name ?? null, null],
            ["gameDate/start-time", failedSelector.expectedStartTime, official.gameDate ?? null,
              Number.isFinite(Date.parse(official.gameDate ?? "")) && Math.abs(Date.parse(official.gameDate) - Date.parse(failedSelector.expectedStartTime)) <= 60_000],
          ].map(([field, failedValue, officialValue, matches]) => ({ field, failedValue, officialValue, result: matches === null ? "not_used_by_selector" : matches ? "match" : "mismatch" })) : [];
          process.stdout.write(`${JSON.stringify({
            operation: "mlb-game-identity-diagnostic",
            scheduleRequestCount,
            selectorOutcome,
            targetRecordCount: targetRows.length,
            officialGames: rows.map(project),
            targetComparisons: comparisons,
          })}\n`);
          if (targetRows.length !== 1) throw new Error("mlb_identity_diagnostic_target_not_unambiguous");
          NODE

