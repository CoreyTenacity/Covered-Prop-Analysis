# COVERED 2 PRODUCTION WAKE - the single recurring production trigger.
#
# DISABLING THIS DISABLES THE ENTIRE LIVE COVERED 2 REFRESH PATH.
#
# The name and the comment above used to say "WNBA current-evidence only ...
# never scores, builds a board, publishes a snapshot, grades props". That is no
# longer true and had become actively misleading: this one workflow now owns
#   - WNBA current-evidence refresh
#   - MLB refresh, schedule ingest, identity, player logs and postgame settlement
#   - odds-snapshot and current-prop retention for BOTH leagues
#   - the WNBA league profile
#   - the Covered Picks board build (gated by COVERED2_PICKS_BOARD_BUILD)
#
# Trigger chain, proven 2026-08-28:
#   Cloudflare Worker `covered-github-dispatcher`, cron "0,30 11-23,0-4 * * *" UTC
#     -> repository_dispatch `covered2-wnba-refresh`  (event type UNCHANGED on purpose)
#     -> this workflow; repository-level preflight and Production gate must both authorize recurrence
#     -> the private Covered repo checked out at the immutable SHA reviewed here
#
# The event type and file path are deliberately NOT renamed: the dispatcher
# sends this exact event, and renaming either would break the only production
# wake for a cosmetic gain.
#
# NOTE: COVERED_GITHUB_SCHEDULER_ENABLED does NOT gate this workflow. It gates
# the legacy covered-production-pipeline.yml only, and is false.
name: "Covered 2 Production Wake (dispatch event: covered2-wnba-refresh)"

on:
  repository_dispatch:
    types: [covered2-wnba-refresh]
  workflow_dispatch:
    inputs:
      operation:
        description: "One bounded exact-market operation"
        required: true
        type: choice
        options:
          - exact-market-preflight
          - exact-market-discovery
          - exact-market-board-refresh
          - mlb-game-identity-diagnostic
          - mlb-event-hydration
          - mlb-player-history-hydration
          - wnba-event-hydration
          - certification-one-observation
          - certification-one-current-analysis
      release_sha:
        description: "Reviewed full Covered release SHA"
        required: true
        type: string
      validation_sport:
        description: "Exact sport"
        required: true
        type: choice
        options:
          - NFL
          - MLB
          - WNBA
          - NBA
      validation_market:
        description: "Exact market key"
        required: true
        type: string
      force_discovery:
        description: "Use the one-off NFL discovery-cadence bypass"
        required: false
        default: false
        type: boolean
      scored_prop_id:
        description: "Exact existing scored_props UUID; required only for certification-one-observation"
        required: false
        type: string
      mlb_event_date:
        description: "Exact MLB official date for one current postseason event"
        required: false
        type: string
      mlb_event_start_time:
        description: "Exact expected MLB event start instant in UTC"
        required: false
        type: string
      mlb_home_team_id:
        description: "Exact expected MLB Stats API home team ID"
        required: false
        type: string
      mlb_away_team_id:
        description: "Exact expected MLB Stats API away team ID"
        required: false
        type: string
      mlb_game_type:
        description: "Exact MLB postseason game type (F, D, L, or W)"
        required: false
        type: string
      mlb_series_description:
        description: "Exact series description from MLB Stats API"
        required: false
        type: string
      mlb_game_pk:
        description: "Exact MLB gamePk for one-event Batter Total Bases discovery or history hydration"
        required: false
        type: string
      wnba_event_id:
        description: "Exact ESPN event ID for one upcoming WNBA postseason event"
        required: false
        type: string
      wnba_event_date:
        description: "Exact official WNBA event date in Eastern Time"
        required: false
        type: string
      wnba_event_start_time:
        description: "Exact expected WNBA event start instant in canonical UTC"
        required: false
        type: string
      wnba_home_team_id:
        description: "Exact expected ESPN WNBA home team ID"
        required: false
        type: string
      wnba_away_team_id:
        description: "Exact expected ESPN WNBA away team ID"
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.event.client_payload.manual_validation == true && 'covered2-wnba-refresh-manual-validation' || 'covered2-wnba-refresh' }}
  cancel-in-progress: false

jobs:
  scheduler_preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      allow_refresh: ${{ steps.scheduler_gate.outputs.allow_refresh }}
    steps:
      - name: Fail closed on the repository-level recurring scheduler gate
        id: scheduler_gate
        env:
          TRIGGER: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Manual operations proceed only to the existing Production-environment
          # owner/SHA/operation contract, and only from the owner's main ref.
          if [ "$TRIGGER" = "workflow_dispatch" ]; then
            if [ "$ACTOR" = "CoreyTenacity" ] && [ "$REF_NAME" = "main" ]; then
              echo "allow_refresh=true" >> "$GITHUB_OUTPUT"
              echo "Owner main-ref dispatch deferred to its existing exact-operation contract."
            else
              echo "allow_refresh=false" >> "$GITHUB_OUTPUT"
              echo "Manual dispatch is not from the authorized owner on main; blocked before Production environment."
            fi
            exit 0
          fi

          if [ "$TRIGGER" != "repository_dispatch" ]; then
            echo "allow_refresh=false" >> "$GITHUB_OUTPUT"
            echo "Unsupported trigger; blocked before Production environment."
            exit 0
          fi

          VARIABLE_URL="${GITHUB_API_URL:-https://api.github.com}/repos/${GITHUB_REPOSITORY}/actions/variables/COVERED2_WNBA_SCHEDULER_ENABLED"
          VARIABLE_RESPONSE="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$VARIABLE_URL")" || {
              echo "allow_refresh=false" >> "$GITHUB_OUTPUT"
              echo "Repository-level scheduler variable could not be read; recurrence blocked before Production environment."
              exit 0
            }
          REPOSITORY_SCHEDULER_VALUE="$(printf '%s' "$VARIABLE_RESPONSE" | node -e '
            let input = "";
            for await (const chunk of process.stdin) input += chunk;
            const variable = JSON.parse(input);
            if (variable.name !== "COVERED2_WNBA_SCHEDULER_ENABLED" || typeof variable.value !== "string") {
              throw new Error("repository_scheduler_variable_invalid");
            }
            process.stdout.write(variable.value);
          ')" || {
              echo "allow_refresh=false" >> "$GITHUB_OUTPUT"
              echo "Repository-level scheduler variable response was invalid; recurrence blocked before Production environment."
              exit 0
            }

          if [ "$REPOSITORY_SCHEDULER_VALUE" = "true" ]; then
            echo "allow_refresh=true" >> "$GITHUB_OUTPUT"
            echo "Repository recurring gate explicitly allows this wake; Production gate remains required."
            exit 0
          fi

          echo "allow_refresh=false" >> "$GITHUB_OUTPUT"
          echo "Repository recurring gate is absent, malformed, or not true; blocked before Production environment."

  refresh:
    needs: scheduler_preflight
    if: needs.scheduler_preflight.outputs.allow_refresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      COVERED2_ALLOWED_EMAILS: ${{ secrets.COVERED2_ALLOWED_EMAILS }}
      COVERED2_SCHEDULER_CADENCE: ${{ vars.COVERED2_SCHEDULER_CADENCE }}
      COVERED2_PRODUCTION_DEPLOYMENT_AUTHORIZED: ${{ vars.COVERED2_PRODUCTION_DEPLOYMENT_AUTHORIZED }}
      COVERED2_WNBA_SCHEDULER_ENABLED: ${{ vars.COVERED2_WNBA_SCHEDULER_ENABLED }}
      COVERED2_MLB_SCHEDULE_INGEST: ${{ vars.COVERED2_MLB_SCHEDULE_INGEST }}
      COVERED2_MLB_PLAYER_IDENTITY: ${{ vars.COVERED2_MLB_PLAYER_IDENTITY }}
      COVERED_RETENTION_UNBLOCK_ENABLED: ${{ vars.COVERED_RETENTION_UNBLOCK_ENABLED }}
      COVERED_SNAPSHOT_ALIAS_DEDUP_ENABLED: ${{ vars.COVERED_SNAPSHOT_ALIAS_DEDUP_ENABLED }}
      COVERED_COMPACT_RECEIPT_WRITES_ENABLED: ${{ vars.COVERED_COMPACT_RECEIPT_WRITES_ENABLED }}
      COVERED_COMPACT_GAME_LOG_WRITES_ENABLED: ${{ vars.COVERED_COMPACT_GAME_LOG_WRITES_ENABLED }}
      COVERED2_MLB_MARKET_GAMELOG: ${{ vars.COVERED2_MLB_MARKET_GAMELOG }}
      COVERED2_MLB_MARKET_OPPONENT: ${{ vars.COVERED2_MLB_MARKET_OPPONENT }}
      COVERED2_MLB_PLAYER_LOG_REFRESH: ${{ vars.COVERED2_MLB_PLAYER_LOG_REFRESH }}
      COVERED2_MLB_LINEUP_REFRESH: ${{ vars.COVERED2_MLB_LINEUP_REFRESH }}
      COVERED2_NFL_RECEPTIONS_REFRESH: ${{ vars.COVERED2_NFL_RECEPTIONS_REFRESH }}
      COVERED2_NFL_RECEIVING_YARDS_REFRESH: ${{ vars.COVERED2_NFL_RECEIVING_YARDS_REFRESH }}
      COVERED2_NFL_RUSHING_YARDS_REFRESH: ${{ vars.COVERED2_NFL_RUSHING_YARDS_REFRESH }}
      COVERED2_NFL_PASSING_YARDS_REFRESH: ${{ vars.COVERED2_NFL_PASSING_YARDS_REFRESH }}
      COVERED2_PICKS_BOARD_BUILD: ${{ vars.COVERED2_PICKS_BOARD_BUILD }}
      SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
      BBS_API_KEY: ${{ secrets.BBS_API_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COVERED_EGRESS_DIAGNOSTIC: ${{ vars.COVERED_EGRESS_DIAGNOSTIC }}
      KNOWLEDGE_LOW_EGRESS_MODE: ${{ vars.KNOWLEDGE_LOW_EGRESS_MODE }}
      COVERED2_EVENT_AWARE_RUNTIME_ENABLED: ${{ vars.COVERED2_EVENT_AWARE_RUNTIME_ENABLED }}
      COVERED2_EVENT_AWARE_SHADOW_ENABLED: ${{ vars.COVERED2_EVENT_AWARE_SHADOW_ENABLED }}
      COVERED2_CERTIFICATION_LEDGER_ENABLED: ${{ vars.COVERED2_CERTIFICATION_LEDGER_ENABLED }}
      COVERED2_NFL_RECEIVING_PILOT_ENABLED: ${{ vars.COVERED2_NFL_RECEIVING_PILOT_ENABLED }}
      COVERED2_NFL_RECEIVING_PILOT_START_AT: ${{ vars.COVERED2_NFL_RECEIVING_PILOT_START_AT }}
      COVERED2_REFRESH_RUNTIME: "github-actions-c2-wnba"
    steps:
      - name: Count bounded natural NFL Receiving Yards pilot attempts
        id: pilot_attempt_guard
        env:
          TRIGGER: ${{ github.event_name }}
          MANUAL_VALIDATION: ${{ github.event.client_payload.manual_validation }}
          SCHEDULER_ENABLED: ${{ vars.COVERED2_WNBA_SCHEDULER_ENABLED }}
          MARKET_SCOPE: ${{ vars.COVERED2_SCHEDULED_MARKET_SCOPE }}
          RECEIVING_YARDS_ENABLED: ${{ vars.COVERED2_NFL_RECEIVING_YARDS_REFRESH }}
          RECEPTIONS_ENABLED: ${{ vars.COVERED2_NFL_RECEPTIONS_REFRESH }}
          RUSHING_YARDS_ENABLED: ${{ vars.COVERED2_NFL_RUSHING_YARDS_REFRESH }}
          PASSING_YARDS_ENABLED: ${{ vars.COVERED2_NFL_PASSING_YARDS_REFRESH }}
          CERTIFICATION_WRITE_ENABLED: ${{ vars.COVERED2_CERTIFICATION_LEDGER_ENABLED }}
          NBA_LIFECYCLE_ENABLED: ${{ vars.COVERED2_NBA_LIFECYCLE_ENABLED }}
          PILOT_ENABLED: ${{ vars.COVERED2_NFL_RECEIVING_PILOT_ENABLED }}
          PILOT_START_AT: ${{ vars.COVERED2_NFL_RECEIVING_PILOT_START_AT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Manual owner operations are governed by the contract step, not counted as natural pilot wakes.
          if [ "$TRIGGER" != "repository_dispatch" ] || [ "$MANUAL_VALIDATION" = "true" ]; then
            echo "pilot_attempt_guard=not_applicable" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$SCHEDULER_ENABLED" != "true" ]; then
            echo "pilot_attempt_guard=scheduler_paused" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$MARKET_SCOPE" != "NFL:receiving_yards" ] \
            || [ "$RECEIVING_YARDS_ENABLED" != "true" ] \
            || [ "$RECEPTIONS_ENABLED" != "false" ] \
            || [ "$RUSHING_YARDS_ENABLED" != "false" ] \
            || [ "$PASSING_YARDS_ENABLED" != "false" ] \
            || [ "$CERTIFICATION_WRITE_ENABLED" != "false" ] \
            || [ "$NBA_LIFECYCLE_ENABLED" = "true" ]; then
            echo "::error::Rejected bounded pilot: exact NFL receiving_yards scope and disabled sibling/write capabilities are required."
            exit 1
          fi

          if [ "$PILOT_ENABLED" = "false" ]; then
            echo "pilot_attempt_guard=normal_exact_market_recurrence" >> "$GITHUB_OUTPUT"
            echo "Bounded NFL Receiving Yards pilot mode is explicitly disabled; exact-market normal recurrence remains gated by the validated scope and market capabilities."
            exit 0
          fi
          if [ "$PILOT_ENABLED" != "true" ]; then
            echo "::error::NFL Receiving Yards pilot mode must be exactly true or false."
            exit 1
          fi

          if ! printf '%s' "$PILOT_START_AT" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,3})?Z$'; then
            echo "::error::Bounded NFL pilot start timestamp is missing or malformed."
            exit 1
          fi
          START_EPOCH_MS="$(node -e 'const value = Date.parse(process.argv[1]); if (!Number.isFinite(value)) process.exit(1); process.stdout.write(String(value));' "$PILOT_START_AT")" || {
            echo "::error::Bounded NFL pilot start timestamp is not a valid UTC instant."
            exit 1
          }
          NOW_EPOCH_MS="$(node -e 'process.stdout.write(String(Date.now()))')"
          if [ "$START_EPOCH_MS" -gt "$NOW_EPOCH_MS" ]; then
            echo "::error::Bounded NFL pilot start timestamp is in the future."
            exit 1
          fi
          if [ "$((NOW_EPOCH_MS - START_EPOCH_MS))" -ge 86400000 ]; then
            echo "::error::Bounded NFL pilot window has expired."
            exit 1
          fi

          API_URL="${GITHUB_API_URL:-https://api.github.com}/repos/${GITHUB_REPOSITORY}/actions/workflows/covered2-wnba-refresh.yml/runs"
          RUN_HISTORY="$(curl --fail --silent --show-error --get \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-urlencode "event=repository_dispatch" \
            --data-urlencode "created=>=$PILOT_START_AT" \
            --data-urlencode "per_page=100" \
            "$API_URL")" || {
              echo "::error::Could not read bounded pilot wake history; failing closed before private checkout."
              exit 1
            }
          ATTEMPT_SUMMARY="$(printf '%s' "$RUN_HISTORY" | node -e '
            let input = "";
            for await (const chunk of process.stdin) input += chunk;
            const [start, currentRunId] = process.argv.slice(1);
            const result = JSON.parse(input);
            if (!Array.isArray(result.workflow_runs) || !Number.isInteger(result.total_count) || result.total_count > 100) {
              throw new Error("pilot_history_unbounded_or_invalid");
            }
            const startTime = Date.parse(start);
            const runs = result.workflow_runs.filter((run) =>
              run.event === "repository_dispatch" && Number.isFinite(Date.parse(run.created_at)) && Date.parse(run.created_at) >= startTime,
            );
            const attempts = runs.reduce((sum, run) => sum + Math.max(1, Number(run.run_attempt) || 1), 0);
            const currentIncluded = runs.some((run) => String(run.id) === currentRunId);
            process.stdout.write(`${attempts} ${currentIncluded ? "1" : "0"}`);
          ' "$PILOT_START_AT" "$GITHUB_RUN_ID")" || {
            echo "::error::Could not safely count bounded pilot wake history; failing closed before private checkout."
            exit 1
          }
          read -r PRIOR_ATTEMPTS CURRENT_INCLUDED <<< "$ATTEMPT_SUMMARY"
          if [ "$CURRENT_INCLUDED" = "1" ]; then
            TOTAL_ATTEMPTS="$PRIOR_ATTEMPTS"
          else
            TOTAL_ATTEMPTS="$((PRIOR_ATTEMPTS + 1))"
          fi
          if [ "$TOTAL_ATTEMPTS" -gt 3 ]; then
            echo "::error::Bounded NFL pilot exhausted its three natural wake attempts; refusing private checkout."
            exit 1
          fi
          echo "pilot_attempt_guard=allowed" >> "$GITHUB_OUTPUT"
          echo "pilot_attempt_number=$TOTAL_ATTEMPTS" >> "$GITHUB_OUTPUT"
          echo "Bounded NFL pilot wake attempt $TOTAL_ATTEMPTS of 3 accepted; no pin value or token logged."

      - name: Resolve and validate the C2 dispatch contract
        id: contract
        env:
          EVENT_TYPE: ${{ github.event.action }}
          TRIGGER: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SCHEMA: ${{ github.event.client_payload.schema }}
          SOURCE: ${{ github.event.client_payload.source }}
          SLOT: ${{ github.event.client_payload.slot }}
          DELIVERY_KEY: ${{ github.event.client_payload.delivery_key }}
          MANUAL_VALIDATION: ${{ github.event.client_payload.manual_validation }}
          VALIDATION_SPORT: ${{ github.event.client_payload.manual_validation_sport }}
          FORCE_DISCOVERY: ${{ github.event.client_payload.manual_validation_force_discovery }}
          MANUAL_VALIDATION_ID: ${{ github.event.client_payload.validation_id }}
          VALIDATION_MODE: ${{ github.event.client_payload.manual_validation_mode }}
          CERTIFICATION_OBSERVATION_ID: ${{ github.event.client_payload.certification_observation_id }}
          EXPECTED_SHA: ${{ github.event.client_payload.expected_sha }}
          ACTOR: ${{ github.actor }}
          SENDER: ${{ github.event.sender.login }}
          SCHEDULER_ENABLED: ${{ vars.COVERED2_WNBA_SCHEDULER_ENABLED }}
          ALLOWLIST: ${{ secrets.COVERED2_ALLOWED_EMAILS }}
          CADENCE: ${{ vars.COVERED2_SCHEDULER_CADENCE }}
          DEPLOYMENT_AUTHORIZED: ${{ vars.COVERED2_PRODUCTION_DEPLOYMENT_AUTHORIZED }}
          CERTIFICATION_LEDGER_ENABLED: ${{ vars.COVERED2_CERTIFICATION_LEDGER_ENABLED }}
          BOARD_BUILD_ENABLED: ${{ vars.COVERED2_PICKS_BOARD_BUILD }}
          MANUAL_OPERATION: ${{ inputs.operation }}
          RELEASE_SHA_INPUT: ${{ inputs.release_sha }}
          VALIDATION_SPORT_INPUT: ${{ inputs.validation_sport }}
          VALIDATION_MARKET_INPUT: ${{ inputs.validation_market }}
          FORCE_DISCOVERY_INPUT: ${{ inputs.force_discovery }}
          SCORED_PROP_ID_INPUT: ${{ inputs.scored_prop_id }}
          MLB_EVENT_DATE_INPUT: ${{ inputs.mlb_event_date }}
          MLB_EVENT_START_TIME_INPUT: ${{ inputs.mlb_event_start_time }}
          MLB_HOME_TEAM_ID_INPUT: ${{ inputs.mlb_home_team_id }}
          MLB_AWAY_TEAM_ID_INPUT: ${{ inputs.mlb_away_team_id }}
          MLB_GAME_TYPE_INPUT: ${{ inputs.mlb_game_type }}
          MLB_SERIES_DESCRIPTION_INPUT: ${{ inputs.mlb_series_description }}
          MLB_GAME_PK_INPUT: ${{ inputs.mlb_game_pk }}
          WNBA_EVENT_ID_INPUT: ${{ inputs.wnba_event_id }}
          WNBA_EVENT_DATE_INPUT: ${{ inputs.wnba_event_date }}
          WNBA_EVENT_START_TIME_INPUT: ${{ inputs.wnba_event_start_time }}
          WNBA_HOME_TEAM_ID_INPUT: ${{ inputs.wnba_home_team_id }}
          WNBA_AWAY_TEAM_ID_INPUT: ${{ inputs.wnba_away_team_id }}
        run: |
          REVIEWED_RELEASE_SHA="2a1e8d73ee0dd7fd5563270de7c4f8a015c3afca"
          if [ "$TRIGGER" = "workflow_dispatch" ]; then
            if [ "$REF_NAME" != "main" ] \
              || [ "$ACTOR" != "CoreyTenacity" ] \
              || [ "$SCHEDULER_ENABLED" != "false" ] \
              || [ "$RELEASE_SHA_INPUT" != "$REVIEWED_RELEASE_SHA" ] \
              || ! printf '%s' "$RELEASE_SHA_INPUT" | grep -Eq '^[0-9a-f]{40}$' \
              || [ "$ALLOWLIST" != "corey093011@gmail.com" ] \
              || [ "$CADENCE" != "0,30 11-23,0-4 * * *" ] \
              || [ "$DEPLOYMENT_AUTHORIZED" != "true" ] \
              || [ "$CERTIFICATION_LEDGER_ENABLED" != "false" ]; then
              echo "::error::Rejected exact-market workflow dispatch; owner, repair ref, reviewed SHA, paused scheduler, and persistent gates are required."
              exit 1
            fi
            case "$VALIDATION_SPORT_INPUT:$VALIDATION_MARKET_INPUT" in
              NFL:receiving_yards|NFL:rushing_yards|MLB:batter_total_bases|MLB:pitcher_strikeouts|WNBA:rebounds|NBA:points|NBA:rebounds|NBA:assists) ;;
              *) echo "::error::Unsupported exact sport/market pair."; exit 1 ;;
            esac
            case "$MANUAL_OPERATION" in
              exact-market-preflight)
                if [ "$VALIDATION_SPORT_INPUT" != "NFL" ] || [ "$FORCE_DISCOVERY_INPUT" != "false" ]; then
                  echo "::error::The read-only exact-market preflight is restricted to one NFL market with no discovery bypass."
                  exit 1
                fi
                echo "mode=manual-preflight" >> "$GITHUB_OUTPUT"
                echo "force_discovery=false" >> "$GITHUB_OUTPUT"
                ;;
              exact-market-discovery)
                if [ "$FORCE_DISCOVERY_INPUT" = "true" ] && [ "$VALIDATION_SPORT_INPUT" != "NFL" ]; then
                  echo "::error::The discovery-cadence bypass is restricted to one NFL market."
                  exit 1
                fi
                if [ "$FORCE_DISCOVERY_INPUT" != "true" ] && [ "$FORCE_DISCOVERY_INPUT" != "false" ]; then
                  echo "::error::force_discovery must be exactly true or false."
                  exit 1
                fi
                if [ "$VALIDATION_SPORT_INPUT:$VALIDATION_MARKET_INPUT" = "MLB:batter_total_bases" ]; then
                  if ! printf '%s' "$MLB_GAME_PK_INPUT" | grep -Eq '^[1-9][0-9]{0,11}$'; then
                    echo "::error::MLB Batter Total Bases manual operation requires one bounded positive numeric gamePk."
                    exit 1
                  fi
                  echo "mlb_game_pk=$MLB_GAME_PK_INPUT" >> "$GITHUB_OUTPUT"
                elif [ -n "$MLB_GAME_PK_INPUT" ]; then
                  echo "::error::mlb_game_pk is valid only for the exact MLB Batter Total Bases manual proof."
                  exit 1
                fi
                echo "mode=manual-validation" >> "$GITHUB_OUTPUT"
                echo "force_discovery=$FORCE_DISCOVERY_INPUT" >> "$GITHUB_OUTPUT"
                ;;
              exact-market-board-refresh)
                if [ "$VALIDATION_SPORT_INPUT:$VALIDATION_MARKET_INPUT" != "NFL:receiving_yards" ] \
                  || [ "$FORCE_DISCOVERY_INPUT" != "true" ] \
                  || [ "$BOARD_BUILD_ENABLED" != "true" ]; then
                  echo "::error::Published one-shot board refresh requires exact NFL receiving_yards and the explicit one-off discovery control."
                  exit 1
                fi
                echo "mode=manual-board-refresh" >> "$GITHUB_OUTPUT"
                echo "force_discovery=true" >> "$GITHUB_OUTPUT"
                echo "publish_board=true" >> "$GITHUB_OUTPUT"
                ;;
              mlb-game-identity-diagnostic)
                if [ "$VALIDATION_SPORT_INPUT:$VALIDATION_MARKET_INPUT" != "MLB:batter_total_bases" ] \
                  || [ "$FORCE_DISCOVERY_INPUT" != "false" ] \
                  || [ "$MLB_EVENT_DATE_INPUT" != "2026-10-15" ] \
                  || [ "$CERTIFICATION_LEDGER_ENABLED" != "false" ]; then
                  echo "::error::MLB identity diagnostic requires the exact target date/market, no discovery bypass, and disabled certification writes."
                  exit 1
                fi
                echo "mode=manual-mlb-game-identity-diagnostic" >> "$GITHUB_OUTPUT"
                echo "force_discovery=false" >> "$GITHUB_OUTPUT"
                echo "mlb_event_date=$MLB_EVENT_DATE_INPUT" >> "$GITHUB_OUTPUT"
                ;;
              mlb-event-hydration)
                for event_input in "$MLB_GAME_PK_INPUT" "$MLB_EVENT_DATE_INPUT" "$MLB_EVENT_START_TIME_INPUT" "$MLB_HOME_TEAM_ID_INPUT" "$MLB_AWAY_TEAM_ID_INPUT" "$MLB_GAME_TYPE_INPUT" "$MLB_SERIES_DESCRIPTION_INPUT"; do
                  case "$event_input" in
                    *$'\n'*|*$'\r'*) echo "::error::MLB event inputs may not contain line breaks."; exit 1 ;;
                  esac
                done
                if [ "$VALIDATION_SPORT_INPUT:$VALIDATION_MARKET_INPUT" != "MLB:batter_total_bases" ] \
                  || [ "$FORCE_DISCOVERY_INPUT" != "false" ] \
                  || ! printf '%s' "$MLB_GAME_PK_INPUT" | grep -Eq '^[1-9][0-9]{0,11}$' \
                  || ! printf '%s' "$MLB_EVENT_DATE_INPUT" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' \
                  || ! printf '%s' "$MLB_EVENT_START_TIME_INPUT" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.000Z$' \
                  || ! printf '%s' "$MLB_HOME_TEAM_ID_INPUT" | grep -Eq '^[0-9]{1,6}$' \
                  || ! printf '%s' "$MLB_AWAY_TEAM_ID_INPUT" | grep -Eq '^[0-9]{1,6}$' \
                  || [ "$MLB_HOME_TEAM_ID_INPUT" = "$MLB_AWAY_TEAM_ID_INPUT" ] \
                  || ! printf '%s' "$MLB_GAME_TYPE_INPUT" | grep -Eq '^[FDLW]$' \
                  || ! printf '%s' "$MLB_SERIES_DESCRIPTION_INPUT" | grep -Eq "^[A-Za-z0-9 ,.'-]{3,80}$" \
                  || [ "$CERTIFICATION_LEDGER_ENABLED" != "false" ]; then
                  echo "::error::MLB event hydration requires one exact postseason event, paused scheduler, disabled certification writes, and no discovery bypass."
                  exit 1
                fi
                echo "mode=manual-mlb-event-hydration" >> "$GITHUB_OUTPUT"
                echo "force_discovery=false" >> "$GITHUB_OUTPUT"
                echo "mlb_game_pk=$MLB_GAME_PK_INPUT" >> "$GITHUB_OUTPUT"
                echo "mlb_event_date=$MLB_EVENT_DATE_INPUT" >> "$GITHUB_OUTPUT"
                echo "mlb_event_start_time=$MLB_EVENT_START_TIME_INPUT" >> "$GITHUB_OUTPUT"
                echo "mlb_home_team_id=$MLB_HOME_TEAM_ID_INPUT" >> "$GITHUB_OUTPUT"
                echo "mlb_away_team_id=$MLB_AWAY_TEAM_ID_INPUT" >> "$GITHUB_OUTPUT"
                echo "mlb_game_type=$MLB_GAME_TYPE_INPUT" >> "$GITHUB_OUTPUT"
                echo "mlb_series_description=$MLB_SERIES_DESCRIPTION_INPUT" >> "$GITHUB_OUTPUT"
                ;;
              mlb-player-history-hydration)
                if [ "$VALIDATION_SPORT_INPUT:$VALIDATION_MARKET_INPUT" != "MLB:batter_total_bases" ] \
                  || [ "$FORCE_DISCOVERY_INPUT" != "false" ] \
                  || ! printf '%s' "$MLB_GAME_PK_INPUT" | grep -Eq '^[1-9][0-9]{0,11}$' \
                  || [ -n "$SCORED_PROP_ID_INPUT" ] \
                  || [ -n "$MLB_EVENT_DATE_INPUT" ] \
                  || [ -n "$MLB_EVENT_START_TIME_INPUT" ] \
                  || [ -n "$MLB_HOME_TEAM_ID_INPUT" ] \
                  || [ -n "$MLB_AWAY_TEAM_ID_INPUT" ] \
                  || [ -n "$MLB_GAME_TYPE_INPUT" ] \
                  || [ -n "$MLB_SERIES_DESCRIPTION_INPUT" ] \
                  || [ "$CERTIFICATION_LEDGER_ENABLED" != "false" ]; then
                  echo "::error::MLB player-history hydration is restricted to the exact Total Bases event, with no discovery bypass or other operation inputs."
                  exit 1
                fi
                echo "mode=manual-mlb-player-history-hydration" >> "$GITHUB_OUTPUT"
                echo "force_discovery=false" >> "$GITHUB_OUTPUT"
                echo "mlb_game_pk=$MLB_GAME_PK_INPUT" >> "$GITHUB_OUTPUT"
                ;;
              wnba-event-hydration)
                for event_input in "$WNBA_EVENT_ID_INPUT" "$WNBA_EVENT_DATE_INPUT" "$WNBA_EVENT_START_TIME_INPUT" "$WNBA_HOME_TEAM_ID_INPUT" "$WNBA_AWAY_TEAM_ID_INPUT"; do
                  case "$event_input" in
                    *$'\n'*|*$'\r'*) echo "::error::WNBA event inputs may not contain line breaks."; exit 1 ;;
                  esac
                done
                if [ "$VALIDATION_SPORT_INPUT:$VALIDATION_MARKET_INPUT" != "WNBA:rebounds" ] \
                  || [ "$FORCE_DISCOVERY_INPUT" != "false" ] \
                  || { [ -n "$WNBA_EVENT_ID_INPUT" ] && ! printf '%s' "$WNBA_EVENT_ID_INPUT" | grep -Eq '^[1-9][0-9]{0,19}$'; } \
                  || ! printf '%s' "$WNBA_EVENT_DATE_INPUT" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' \
                  || ! printf '%s' "$WNBA_EVENT_START_TIME_INPUT" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$' \
                  || ! printf '%s' "$WNBA_HOME_TEAM_ID_INPUT" | grep -Eq '^[0-9]+$' \
                  || ! printf '%s' "$WNBA_AWAY_TEAM_ID_INPUT" | grep -Eq '^[0-9]+$' \
                  || [ "$WNBA_HOME_TEAM_ID_INPUT" = "$WNBA_AWAY_TEAM_ID_INPUT" ] \
                  || [ -n "$SCORED_PROP_ID_INPUT" ] \
                  || [ -n "$MLB_EVENT_DATE_INPUT" ] \
                  || [ -n "$MLB_EVENT_START_TIME_INPUT" ] \
                  || [ -n "$MLB_HOME_TEAM_ID_INPUT" ] \
                  || [ -n "$MLB_AWAY_TEAM_ID_INPUT" ] \
                  || [ -n "$MLB_GAME_TYPE_INPUT" ] \
                  || [ -n "$MLB_SERIES_DESCRIPTION_INPUT" ] \
                  || [ -n "$MLB_GAME_PK_INPUT" ] \
                  || [ "$SCHEDULER_ENABLED" != "false" ] \
                  || [ "$CERTIFICATION_LEDGER_ENABLED" != "false" ]; then
                  echo "::error::WNBA event hydration requires one exact upcoming-event target, paused scheduler, disabled certification writes, no discovery bypass, and no other operation inputs."
                  exit 1
                fi
                echo "mode=manual-wnba-event-hydration" >> "$GITHUB_OUTPUT"
                echo "force_discovery=false" >> "$GITHUB_OUTPUT"
                echo "wnba_event_id=$WNBA_EVENT_ID_INPUT" >> "$GITHUB_OUTPUT"
                echo "wnba_event_date=$WNBA_EVENT_DATE_INPUT" >> "$GITHUB_OUTPUT"
                echo "wnba_event_start_time=$WNBA_EVENT_START_TIME_INPUT" >> "$GITHUB_OUTPUT"
                echo "wnba_home_team_id=$WNBA_HOME_TEAM_ID_INPUT" >> "$GITHUB_OUTPUT"
                echo "wnba_away_team_id=$WNBA_AWAY_TEAM_ID_INPUT" >> "$GITHUB_OUTPUT"
                ;;
              certification-one-observation)
                if [ "$FORCE_DISCOVERY_INPUT" != "false" ] \
                  || ! printf '%s' "$SCORED_PROP_ID_INPUT" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'; then
                  echo "::error::Certification requires one exact existing scored_prop UUID and no discovery bypass."
                  exit 1
                fi
                echo "mode=manual-certification" >> "$GITHUB_OUTPUT"
                echo "force_discovery=false" >> "$GITHUB_OUTPUT"
                ;;
              certification-one-current-analysis)
                if [ "$FORCE_DISCOVERY_INPUT" != "false" ] \
                  || [ -n "$SCORED_PROP_ID_INPUT" ] \
                  || [ "$VALIDATION_SPORT_INPUT:$VALIDATION_MARKET_INPUT" != "NFL:receiving_yards" ]; then
                  echo "::error::Current-analysis certification is restricted to one fresh NFL receiving-yards candidate without discovery or an external scored-prop ID."
                  exit 1
                fi
                echo "mode=manual-current-analysis-certification" >> "$GITHUB_OUTPUT"
                echo "force_discovery=false" >> "$GITHUB_OUTPUT"
                ;;
              *) echo "::error::Unsupported exact-market operation."; exit 1 ;;
            esac
            echo "release_sha=$RELEASE_SHA_INPUT" >> "$GITHUB_OUTPUT"
            echo "sport=$VALIDATION_SPORT_INPUT" >> "$GITHUB_OUTPUT"
            echo "market=$VALIDATION_MARKET_INPUT" >> "$GITHUB_OUTPUT"
            if [ "$MANUAL_OPERATION" = "certification-one-observation" ]; then
              echo "scored_prop_id=$SCORED_PROP_ID_INPUT" >> "$GITHUB_OUTPUT"
            fi
            if [ "$MANUAL_OPERATION" != "exact-market-board-refresh" ]; then
              echo "publish_board=false" >> "$GITHUB_OUTPUT"
            fi
            case "$MANUAL_OPERATION" in
              exact-market-discovery|exact-market-board-refresh) echo "manual_validation=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "manual_validation=false" >> "$GITHUB_OUTPUT" ;;
            esac
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "exact_manual=true" >> "$GITHUB_OUTPUT"
            echo "EXACT MARKET dispatch accepted: one owner-gated operation, one reviewed release SHA, one sport, and one market."
            exit 0
          fi
          if [ "$MANUAL_VALIDATION" != "" ] && [ "$MANUAL_VALIDATION" != "true" ] && [ "$MANUAL_VALIDATION" != "false" ]; then
            echo "::error::manual_validation must be exactly true or false when provided."
            exit 1
          fi
          if [ "$SCHEDULER_ENABLED" != "true" ]; then
            if [ "$MANUAL_VALIDATION" = "true" ]; then
              echo "::error::The legacy repository_dispatch manual-validation contract is retired. Use the owner-gated workflow_dispatch exact operation on main."
              exit 1
            fi
            echo "C2 global scheduler gate is false; scheduled and ordinary repository_dispatch wakes exit before private checkout."
            echo "mode=paused" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$MANUAL_VALIDATION" = "true" ]; then
            echo "::error::Manual validation is accepted only while the global scheduler gate is false."
            exit 1
          fi
          if [ "$EVENT_TYPE" != "covered2-wnba-refresh" ] || [ "$SCHEMA" != "covered2-wnba-refresh/v1" ] || [ "$SOURCE" != "cloudflare-cron" ]; then
            echo "::error::Rejected C2 repository_dispatch contract."
            exit 1
          fi
          if ! printf '%s' "$SLOT" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T([0-9]{2}):(00|30)Z$' || [ "$DELIVERY_KEY" != "covered2:wnba:$SLOT" ]; then
            echo "::error::Rejected C2 dispatch slot."
            exit 1
          fi
          if [ "$ALLOWLIST" != "corey093011@gmail.com" ] || [ "$CADENCE" != "0,30 11-23,0-4 * * *" ] || [ "$DEPLOYMENT_AUTHORIZED" != "true" ]; then
            echo "::error::C2 production activation configuration is incomplete."
            exit 1
          fi
          echo "Accepted bounded C2 WNBA slot; immutable configuration validated without printing secrets."
          echo "mode=scheduled" >> "$GITHUB_OUTPUT"
          # repository_dispatch has no manual-validation input; pass the
          # private runner's required explicit false instead of an empty value.
          echo "manual_validation=false" >> "$GITHUB_OUTPUT"
          echo "force_discovery=false" >> "$GITHUB_OUTPUT"
          echo "publish_board=false" >> "$GITHUB_OUTPUT"
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "release_sha=$REVIEWED_RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "sport=" >> "$GITHUB_OUTPUT"
          echo "market=" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check out PRIVATE Covered at the public-reviewed immutable release SHA
        if: steps.contract.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: CoreyTenacity/Covered
          ref: ${{ steps.contract.outputs.release_sha }}
          token: ${{ secrets.COVERED_PRIVATE_REPO_TOKEN }}
          path: private-covered
          persist-credentials: false
          fetch-depth: 1

      - name: Verify private checkout exactly matches the public-reviewed release SHA
        if: steps.contract.outputs.skip != 'true'
        working-directory: private-covered
        env:
          EXPECTED_SHA: ${{ steps.contract.outputs.release_sha }}
        run: |
          GOT="$(git rev-parse HEAD)"
          if [ "$GOT" != "$EXPECTED_SHA" ]; then
            echo "::error::Private checkout does not match the public-reviewed immutable release SHA."
            exit 1
          fi
          echo "Private checkout pin verified."

      - name: Set up pnpm
        if: steps.contract.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Set up Node
        if: steps.contract.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the pinned private runtime
        if: steps.contract.outputs.skip != 'true'
        working-directory: private-covered
        run: pnpm install --frozen-lockfile

      - name: Run read-only schema and exact-market availability preflight
        if: steps.contract.outputs.mode == 'manual-preflight'
        working-directory: private-covered
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
          BBS_API_KEY: ${{ secrets.BBS_API_KEY }}
          PREFLIGHT_MARKET: ${{ steps.contract.outputs.market }}
        run: |
          node --experimental-strip-types --loader ./scripts/ts-path-loader.mjs ./scripts/covered2-schema-contract-check.ts
          node --experimental-strip-types --loader ./scripts/ts-path-loader.mjs --input-type=module -e '
            const { refreshNflMarkets } = await import("./lib/knowledge/covered2/nfl-refresh/production.ts");
            const market = process.env.PREFLIGHT_MARKET;
            if (!["passing_yards", "receiving_yards", "rushing_yards"].includes(market)) throw new Error("unsupported_preflight_market");
            const result = await refreshNflMarkets({ write: false, markets: [market], includeReadOnlyDiagnostics: true });
            const manifest = result.byMarket[market]?.manifest;
            const evidence = {
              status: result.status,
              market,
              providerRequests: manifest?.providerRequests ?? 0,
              providerRows: manifest?.providerRows ?? 0,
              marketRows: manifest?.marketRows ?? 0,
              lineRows: manifest?.lineRows ?? 0,
              unresolvedRows: manifest?.unresolvedRows ?? 0,
              rejectionReasons: manifest?.rejectionReasons ?? {},
              providerMarketTypeCounts: manifest?.providerMarketTypeCounts ?? {},
              eventCount: manifest?.events?.length ?? 0,
              currentPropKeyCount: manifest?.currentPropKeys?.length ?? 0,
            };
            console.log(`[exact-market-preflight] ${JSON.stringify(evidence)}`);
            if (evidence.lineRows < 1 || evidence.eventCount < 1 || evidence.currentPropKeyCount < 1) throw new Error("no_live_exact_market_opportunity");
          '

      - name: Run exactly one bounded C2 exact-market discovery
        if: steps.contract.outputs.skip != 'true' && steps.contract.outputs.mode != 'manual-certification' && steps.contract.outputs.mode != 'manual-current-analysis-certification' && steps.contract.outputs.mode != 'manual-preflight' && steps.contract.outputs.mode != 'manual-mlb-game-identity-diagnostic' && steps.contract.outputs.mode != 'manual-mlb-event-hydration' && steps.contract.outputs.mode != 'manual-mlb-player-history-hydration' && steps.contract.outputs.mode != 'manual-wnba-event-hydration'
        working-directory: private-covered
        env:
          EXPECTED_SHA: ${{ steps.contract.outputs.release_sha }}
          COVERED_PRIVATE_PIPELINE_SHA_V2: ${{ steps.contract.outputs.release_sha }}
          INVOCATION_ID: gha-c2-${{ steps.contract.outputs.mode }}-${{ github.run_id }}
          COVERED2_REFRESH_RUNTIME: ${{ steps.contract.outputs.manual_validation == 'true' && 'github-actions-c2-manual-validation' || 'github-actions-c2-wnba' }}
          COVERED2_MANUAL_VALIDATION: ${{ steps.contract.outputs.manual_validation }}
          COVERED2_MANUAL_VALIDATION_SPORT: ${{ steps.contract.outputs.sport }}
          COVERED2_MANUAL_VALIDATION_MARKET: ${{ steps.contract.outputs.market }}
          COVERED2_MANUAL_MLB_GAME_PK: ${{ steps.contract.outputs.mlb_game_pk }}
          COVERED2_MANUAL_VALIDATION_FORCE_DISCOVERY: ${{ steps.contract.outputs.force_discovery }}
          COVERED2_MANUAL_VALIDATION_PUBLISH_BOARD: ${{ steps.contract.outputs.publish_board }}
          COVERED2_SCHEDULED_MARKET_SCOPE: ${{ vars.COVERED2_SCHEDULED_MARKET_SCOPE }}
          COVERED2_NFL_RECEIVING_PILOT_ENABLED: ${{ vars.COVERED2_NFL_RECEIVING_PILOT_ENABLED }}
          COVERED2_NFL_RECEIVING_PILOT_START_AT: ${{ vars.COVERED2_NFL_RECEIVING_PILOT_START_AT }}
          COVERED2_MLB_SCHEDULE_INGEST: ${{ steps.contract.outputs.mode == 'manual-validation' && steps.contract.outputs.sport != 'MLB' && 'false' || vars.COVERED2_MLB_SCHEDULE_INGEST }}
          COVERED2_MLB_PLAYER_IDENTITY: ${{ steps.contract.outputs.mode == 'manual-validation' && steps.contract.outputs.sport != 'MLB' && 'false' || vars.COVERED2_MLB_PLAYER_IDENTITY }}
          COVERED2_MLB_MARKET_GAMELOG: ${{ steps.contract.outputs.mode == 'manual-validation' && steps.contract.outputs.sport != 'MLB' && 'false' || vars.COVERED2_MLB_MARKET_GAMELOG }}
          COVERED2_MLB_MARKET_OPPONENT: ${{ steps.contract.outputs.mode == 'manual-validation' && steps.contract.outputs.sport != 'MLB' && 'false' || vars.COVERED2_MLB_MARKET_OPPONENT }}
          COVERED2_MLB_PLAYER_LOG_REFRESH: ${{ steps.contract.outputs.mode == 'manual-validation' && steps.contract.outputs.sport != 'MLB' && 'false' || vars.COVERED2_MLB_PLAYER_LOG_REFRESH }}
          COVERED2_MLB_LINEUP_REFRESH: ${{ steps.contract.outputs.mode == 'manual-validation' && steps.contract.outputs.sport != 'MLB' && 'false' || vars.COVERED2_MLB_LINEUP_REFRESH }}
          COVERED2_NFL_RECEPTIONS_REFRESH: ${{ steps.contract.outputs.manual_validation == 'true' && steps.contract.outputs.sport == 'NFL' && steps.contract.outputs.market == 'receptions' && 'true' || steps.contract.outputs.manual_validation == 'true' && 'false' || vars.COVERED2_NFL_RECEPTIONS_REFRESH }}
          COVERED2_NFL_RECEIVING_YARDS_REFRESH: ${{ steps.contract.outputs.manual_validation == 'true' && steps.contract.outputs.sport == 'NFL' && steps.contract.outputs.market == 'receiving_yards' && 'true' || steps.contract.outputs.manual_validation == 'true' && 'false' || vars.COVERED2_NFL_RECEIVING_YARDS_REFRESH }}
          COVERED2_NFL_RUSHING_YARDS_REFRESH: ${{ steps.contract.outputs.manual_validation == 'true' && steps.contract.outputs.sport == 'NFL' && steps.contract.outputs.market == 'rushing_yards' && 'true' || steps.contract.outputs.manual_validation == 'true' && 'false' || vars.COVERED2_NFL_RUSHING_YARDS_REFRESH }}
          COVERED2_NFL_PASSING_YARDS_REFRESH: ${{ steps.contract.outputs.manual_validation == 'true' && steps.contract.outputs.sport == 'NFL' && steps.contract.outputs.market == 'passing_yards' && 'true' || steps.contract.outputs.manual_validation == 'true' && 'false' || vars.COVERED2_NFL_PASSING_YARDS_REFRESH }}
        run: |
          if [ "$COVERED2_MANUAL_VALIDATION" = "true" ]; then
            echo "MANUAL VALIDATION execution run_id=${GITHUB_RUN_ID} runtime=${COVERED2_REFRESH_RUNTIME} expected_sha=${EXPECTED_SHA}"
          fi
          node --experimental-strip-types --loader ./scripts/ts-path-loader.mjs ./scripts/run-covered2-wnba-refresh.mjs --write --expectedSha "$EXPECTED_SHA" --invocationId "$INVOCATION_ID"

      - name: Read exact official MLB game identity without writes
        if: steps.contract.outputs.mode == 'manual-mlb-game-identity-diagnostic'
        working-directory: private-covered
        env:
          EXPECTED_SHA: ${{ steps.contract.outputs.release_sha }}
          COVERED_PRIVATE_PIPELINE_SHA_V2: ${{ steps.contract.outputs.release_sha }}
          COVERED2_MANUAL_MLB_EVENT_HYDRATION: "true"
          COVERED2_WNBA_SCHEDULER_ENABLED: ${{ vars.COVERED2_WNBA_SCHEDULER_ENABLED }}
          COVERED2_CERTIFICATION_LEDGER_ENABLED: ${{ vars.COVERED2_CERTIFICATION_LEDGER_ENABLED }}
          MLB_EVENT_DATE: ${{ steps.contract.outputs.mlb_event_date }}
          COVERED2_ALLOWED_EMAILS: ""
          NEXT_PUBLIC_SUPABASE_URL: ""
          SUPABASE_SECRET_KEY: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
          SHARPAPI_KEY: ""
          BBS_API_KEY: ""
        run: |
          node --experimental-strip-types --loader ./scripts/ts-path-loader.mjs --input-type=module <<'NODE'
          import { main } from "./scripts/run-covered2-mlb-event-hydration.mjs";

          const officialDate = process.env.MLB_EVENT_DATE;
          if (officialDate !== "2026-10-15") throw new Error("mlb_identity_diagnostic_target_date_mismatch");
          const failedSelector = {
            officialDate,
            expectedStartTime: "2026-10-16T00:00:00.000Z",
            homeTeamProviderId: "119",
            awayTeamProviderId: "158",
            gameType: "L",
            seriesDescription: "National League Championship Series",
          };
          const nativeFetch = globalThis.fetch;
          let scheduleRequestCount = 0;
          let sourcePayload;
          globalThis.fetch = async (input, init) => {
            const url = new URL(typeof input === "string" ? input : input instanceof URL ? input : input.url);
            if (url.origin !== "https://statsapi.mlb.com" || url.pathname !== "/api/v1/schedule"
              || url.searchParams.get("sportId") !== "1"
              || url.searchParams.get("startDate") !== officialDate
              || url.searchParams.get("endDate") !== officialDate
              || url.searchParams.get("hydrate") !== "team"
              || (init?.method ?? "GET") !== "GET"
              || scheduleRequestCount !== 0) {
              throw new Error("mlb_identity_diagnostic_unexpected_request");
            }
            scheduleRequestCount += 1;
            const response = await nativeFetch(input, init);
            sourcePayload = JSON.parse(await response.clone().text());
            return response;
          };

          let selectorOutcome = "selected_then_stopped_before_write";
          try {
            await main([
              "--official-date", failedSelector.officialDate,
              "--start-time", failedSelector.expectedStartTime,
              "--home-team-id", failedSelector.homeTeamProviderId,
              "--away-team-id", failedSelector.awayTeamProviderId,
              "--game-type", failedSelector.gameType,
              "--series-description", failedSelector.seriesDescription,
            ], process.env, {
              now: new Date("2026-10-15T12:00:00.000Z"),
              ensureTeam: async () => { throw new Error("diagnostic_stop_before_write"); },
              ensureEvent: async () => { throw new Error("diagnostic_stop_before_write"); },
            });
          } catch (error) {
            selectorOutcome = error instanceof Error ? error.message : "unknown_selector_error";
          } finally {
            globalThis.fetch = nativeFetch;
          }

          if (scheduleRequestCount !== 1 || !sourcePayload || !Array.isArray(sourcePayload.dates)) {
            throw new Error("mlb_identity_diagnostic_source_unavailable");
          }
          const postseasonTypes = new Set(["F", "D", "L", "W"]);
          const allGames = sourcePayload.dates.flatMap((date) => Array.isArray(date.games) ? date.games : []);
          const rows = allGames.filter((game) => game.officialDate === officialDate && postseasonTypes.has(game.gameType)).slice(0, 16);
          const project = (game) => ({
            gamePk: game.gamePk ?? null,
            officialDate: game.officialDate ?? null,
            gameDate: game.gameDate ?? null,
            gameType: game.gameType ?? null,
            seriesDescription: game.seriesDescription ?? null,
            seriesGameNumber: game.seriesGameNumber ?? null,
            awayTeamId: game.teams?.away?.team?.id ?? null,
            awayTeamName: game.teams?.away?.team?.name ?? null,
            homeTeamId: game.teams?.home?.team?.id ?? null,
            homeTeamName: game.teams?.home?.team?.name ?? null,
            status: game.status?.detailedState ?? null,
            scheduledStartTime: game.gameDate ?? null,
          });
          const identity = (value) => String(value ?? "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim().replace(/\s+/g, " ");
          const targetRows = rows.filter((game) => identity(game.teams?.away?.team?.name) === "milwaukee brewers"
            && identity(game.teams?.home?.team?.name) === "los angeles dodgers");
          const official = targetRows.length === 1 ? targetRows[0] : null;
          const comparisons = official ? [
            ["officialDate", failedSelector.officialDate, official.officialDate, failedSelector.officialDate === official.officialDate],
            ["gameType", failedSelector.gameType, official.gameType, failedSelector.gameType === official.gameType],
            ["seriesDescription", failedSelector.seriesDescription, official.seriesDescription, failedSelector.seriesDescription === String(official.seriesDescription ?? "").trim()],
            ["seriesGameNumber", "not used by selector", official.seriesGameNumber ?? null, null],
            ["awayTeamId", failedSelector.awayTeamProviderId, official.teams?.away?.team?.id ?? null, String(failedSelector.awayTeamProviderId) === String(official.teams?.away?.team?.id ?? "")],
            ["awayTeamName", "not used by selector", official.teams?.away?.team?.name ?? null, null],
            ["homeTeamId", failedSelector.homeTeamProviderId, official.teams?.home?.team?.id ?? null, String(failedSelector.homeTeamProviderId) === String(official.teams?.home?.team?.id ?? "")],
            ["homeTeamName", "not used by selector", official.teams?.home?.team?.name ?? null, null],
            ["gameDate/start-time", failedSelector.expectedStartTime, official.gameDate ?? null,
              Number.isFinite(Date.parse(official.gameDate ?? "")) && Math.abs(Date.parse(official.gameDate) - Date.parse(failedSelector.expectedStartTime)) <= 60_000],
          ].map(([field, failedValue, officialValue, matches]) => ({ field, failedValue, officialValue, result: matches === null ? "not_used_by_selector" : matches ? "match" : "mismatch" })) : [];
          process.stdout.write(`${JSON.stringify({
            operation: "mlb-game-identity-diagnostic",
            scheduleRequestCount,
            selectorOutcome,
            targetRecordCount: targetRows.length,
            officialGames: rows.map(project),
            targetComparisons: comparisons,
          })}\n`);
          if (targetRows.length !== 1) throw new Error("mlb_identity_diagnostic_target_not_unambiguous");
          NODE

      - name: Hydrate exact-target MLB Total Bases player history only
        if: steps.contract.outputs.mode == 'manual-mlb-player-history-hydration'
        working-directory: private-covered
        env:
          EXPECTED_SHA: ${{ steps.contract.outputs.release_sha }}
          COVERED_PRIVATE_PIPELINE_SHA_V2: ${{ steps.contract.outputs.release_sha }}
          COVERED2_MANUAL_MLB_PLAYER_HISTORY_HYDRATION: "true"
          COVERED2_WNBA_SCHEDULER_ENABLED: ${{ vars.COVERED2_WNBA_SCHEDULER_ENABLED }}
          COVERED2_CERTIFICATION_LEDGER_ENABLED: ${{ vars.COVERED2_CERTIFICATION_LEDGER_ENABLED }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SHARPAPI_KEY: ""
          BBS_API_KEY: ""
          MLB_GAME_PK: ${{ steps.contract.outputs.mlb_game_pk }}
        run: node --experimental-strip-types --loader ./scripts/ts-path-loader.mjs ./scripts/run-covered2-mlb-player-history-hydration.mjs --game-pk "$MLB_GAME_PK"

      - name: Hydrate exactly one current MLB postseason event only
        if: steps.contract.outputs.mode == 'manual-mlb-event-hydration'
        working-directory: private-covered
        env:
          EXPECTED_SHA: ${{ steps.contract.outputs.release_sha }}
          COVERED_PRIVATE_PIPELINE_SHA_V2: ${{ steps.contract.outputs.release_sha }}
          COVERED2_MANUAL_MLB_EVENT_HYDRATION: "true"
          COVERED2_WNBA_SCHEDULER_ENABLED: ${{ vars.COVERED2_WNBA_SCHEDULER_ENABLED }}
          COVERED2_CERTIFICATION_LEDGER_ENABLED: ${{ vars.COVERED2_CERTIFICATION_LEDGER_ENABLED }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MLB_GAME_PK: ${{ steps.contract.outputs.mlb_game_pk }}
          MLB_EVENT_DATE: ${{ steps.contract.outputs.mlb_event_date }}
          MLB_EVENT_START_TIME: ${{ steps.contract.outputs.mlb_event_start_time }}
          MLB_HOME_TEAM_ID: ${{ steps.contract.outputs.mlb_home_team_id }}
          MLB_AWAY_TEAM_ID: ${{ steps.contract.outputs.mlb_away_team_id }}
          MLB_GAME_TYPE: ${{ steps.contract.outputs.mlb_game_type }}
          MLB_SERIES_DESCRIPTION: ${{ steps.contract.outputs.mlb_series_description }}
        run: |
          node --experimental-strip-types --loader ./scripts/ts-path-loader.mjs ./scripts/run-covered2-mlb-event-hydration.mjs \
            --game-pk "$MLB_GAME_PK" --official-date "$MLB_EVENT_DATE" --start-time "$MLB_EVENT_START_TIME" \
            --home-team-id "$MLB_HOME_TEAM_ID" --away-team-id "$MLB_AWAY_TEAM_ID" \
            --game-type "$MLB_GAME_TYPE" --series-description "$MLB_SERIES_DESCRIPTION"

      - name: Admit exactly one upcoming WNBA postseason event only
        if: steps.contract.outputs.mode == 'manual-wnba-event-hydration'
        working-directory: private-covered
        env:
          EXPECTED_SHA: ${{ steps.contract.outputs.release_sha }}
          COVERED_PRIVATE_PIPELINE_SHA_V2: ${{ steps.contract.outputs.release_sha }}
          COVERED2_MANUAL_WNBA_EVENT_HYDRATION: "true"
          COVERED2_WNBA_SCHEDULER_ENABLED: ${{ vars.COVERED2_WNBA_SCHEDULER_ENABLED }}
          COVERED2_CERTIFICATION_LEDGER_ENABLED: ${{ vars.COVERED2_CERTIFICATION_LEDGER_ENABLED }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SHARPAPI_KEY: ""
          BBS_API_KEY: ""
          WNBA_EVENT_ID: ${{ steps.contract.outputs.wnba_event_id }}
          WNBA_EVENT_DATE: ${{ steps.contract.outputs.wnba_event_date }}
          WNBA_EVENT_START_TIME: ${{ steps.contract.outputs.wnba_event_start_time }}
          WNBA_HOME_TEAM_ID: ${{ steps.contract.outputs.wnba_home_team_id }}
          WNBA_AWAY_TEAM_ID: ${{ steps.contract.outputs.wnba_away_team_id }}
        run: |
          WNBA_EVENT_ARGS=(
            --official-date "$WNBA_EVENT_DATE"
            --start-time "$WNBA_EVENT_START_TIME"
            --home-team-id "$WNBA_HOME_TEAM_ID"
            --away-team-id "$WNBA_AWAY_TEAM_ID"
          )
          if [ -n "$WNBA_EVENT_ID" ]; then
            WNBA_EVENT_ARGS=(--event-id "$WNBA_EVENT_ID" "${WNBA_EVENT_ARGS[@]}")
          fi
          node --experimental-strip-types --loader ./scripts/ts-path-loader.mjs ./scripts/run-covered2-wnba-event-hydration.mjs "${WNBA_EVENT_ARGS[@]}"

      - name: Certify one existing exact-market observation
        if: steps.contract.outputs.mode == 'manual-certification'
        working-directory: private-covered
        env:
          EXPECTED_SHA: ${{ steps.contract.outputs.release_sha }}
          COVERED_PRIVATE_PIPELINE_SHA_V2: ${{ steps.contract.outputs.release_sha }}
          COVERED2_WNBA_SCHEDULER_ENABLED: ${{ vars.COVERED2_WNBA_SCHEDULER_ENABLED }}
          COVERED2_CERTIFICATION_LEDGER_ENABLED: "true"
          COVERED2_MANUAL_CERTIFICATION_VALIDATION: "true"
